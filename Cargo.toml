[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The discovery tests (DSC-17) push gigabytes of JSON through the proxy and the pure
# inference code: unoptimised builds take minutes.
[profile.dev.package.mimic-core]
opt-level = 1

[profile.dev.package."*"]
opt-level = 1
