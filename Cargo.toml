[workspace]
resolver = "3"
members = ["crates/*"]
# Cibles cargo-fuzz : projet à part, compilé en nightly (voir fuzz/README.md).
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
proptest = "1"
insta = { version = "1", features = ["json"] }

[workspace.lints.rust]
unsafe_code = "forbid"
# `cfg(fuzzing)`, posé par cargo-fuzz, ouvre les modules `fuzzing` aux cibles de `fuzz/`.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
