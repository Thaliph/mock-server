name: release

# On a v* tag: multi-arch image (native amd64 and arm64 runners), signed with cosign keyless,
# with SBOM and provenance; then the Helm chart, pushed as an OCI artifact and signed
# (spec §10, FND-10). Everything lands on ghcr.io, free for a public repository.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  REPO: ghcr.io/thaliph/mimic
  CHARTS: ghcr.io/thaliph/charts

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches the workspace version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "v$version" = "$TAG" ] || { echo "tag $TAG != Cargo.toml $version"; exit 1; }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REPO }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.runner }}
          path: digests/*
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Multi-arch index, signed
        id: index
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          docker buildx imagetools create -t "$REPO:$version" \
            $(for d in digests/*; do echo "$REPO@sha256:$(basename "$d")"; done)
          digest=$(docker buildx imagetools inspect "$REPO:$version" --format '{{json .Manifest}}' | jq -r .digest)
          cosign sign --yes "$REPO@$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Helm chart, pinned to the image digest, signed
        env:
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ steps.index.outputs.digest }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=${TAG#v}
          sed -i "s|^  digest: \"\"|  digest: \"$DIGEST\"|" deploy/helm/mimic/values.yaml
          helm package deploy/helm/mimic --version "$version" --app-version "$version" -d dist
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "$GH_ACTOR" --password-stdin
          out=$(helm push "dist/mimic-$version.tgz" "oci://$CHARTS" 2>&1)
          echo "$out"
          chart_digest=$(echo "$out" | sed -n 's/^Digest: //p')
          cosign sign --yes "$CHARTS/mimic@$chart_digest"
      - name: GitHub release
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$TAG" --generate-notes --verify-tag dist/*.tgz
