name: security

# Contrôles de sécurité, à chaque PR, sur main et chaque semaine (nouvelles vulnérabilités
# publiées sur du code inchangé) :
#   - cargo-deny : vulnérabilités RustSec des dépendances, licences, sources ;
#   - CodeQL : analyse statique du code Rust et des workflows ;
#   - zizmor : failles des workflows GitHub Actions (injection, droits, actions non épinglées),
#     bloquant ;
#   - Trivy : mauvaises configurations du Dockerfile et des manifests Kubernetes, bloquant sur
#     HIGH et CRITICAL ;
#   - ignores : raison et échéance de chaque constat accepté (.trivyignore.yaml, zizmor) ;
#   - OpenSSF Scorecard : pratiques du dépôt (sur main seulement).
# Les résultats SARIF arrivent dans l'onglet Security du dépôt.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"

concurrency:
  group: security-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        run: ./scripts/ci-changes.sh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LABELS_JSON: "[]"

  cargo-deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories licenses bans sources

  codeql-rust:
    # Le plus long des contrôles (~7 min) : sauté sur une PR sans changement Rust ou Cargo.
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: rust
          build-mode: none
          queries: security-and-quality
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: /language:rust

  codeql-actions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: actions
          build-mode: none
          queries: security-and-quality
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: /language:actions

  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Premier passage : SARIF vers l'onglet Security (ne fait jamais échouer le job).
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
      # Second passage, bloquant : tout nouveau constat non ignoré fait échouer le job.
      # Les ignores sont des commentaires `zizmor: ignore` suivis de la raison et d'une date de revue AAAA-MM-JJ
      # (vérifiés par le job `ignores`).
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false

  trivy-config:
    # Dockerfile et manifests : utilisateur root, capacités, sondes, images non épinglées…
    # Rapport SARIF complet (MEDIUM compris, sans échec), puis passage bloquant sur HIGH et
    # CRITICAL. Les constats acceptés sont dans .trivyignore.yaml, avec raison et échéance.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-config.sarif
          severity: CRITICAL,HIGH,MEDIUM
          trivyignores: .trivyignore.yaml
          exit-code: "0"
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        if: always()
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore.yaml
          exit-code: "1"

  ignores:
    # Chaque ignore (Trivy, zizmor) porte une raison et une échéance non dépassée.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./scripts/check-ignores.sh

  scorecard:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: scorecard.sarif
          category: scorecard

  security-ok:
    # Unique contrôle à rendre obligatoire (scorecard est ignoré sur PR, par construction).
    if: always()
    needs: [changes, cargo-deny, codeql-rust, codeql-actions, zizmor, trivy-config, ignores, scorecard]
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 2
    steps:
      - run: echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")'
        env:
          NEEDS: ${{ toJSON(needs) }}
