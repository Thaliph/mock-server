# Publie docs/wiki/ dans le wiki GitHub du dépôt à chaque push sur main.
# Prérequis : wiki activé et initialisé (une première page créée depuis l'interface),
# sinon le job s'arrête sans erreur.
name: wiki

on:
  push:
    branches: [main]
    paths: ["docs/wiki/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synchroniser le wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          url="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"
          if ! git clone --depth 1 "$url" wiki 2>/dev/null; then
            echo "::notice::wiki absent ou non initialisé : rien à publier"
            exit 0
          fi
          rsync -a --delete --exclude .git docs/wiki/ wiki/
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "wiki déjà à jour"
            exit 0
          fi
          git commit -m "Synchronisation depuis ${GITHUB_SHA::7}"
          git push
