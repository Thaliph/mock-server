name: ci

# Politique CI (#71). Pas de `paths:` au niveau du workflow : un workflow filtré laisserait ses
# contrôles « en attente » ; le filtrage se fait par le job `changes` et des `if:` de job (un job
# ignoré par `if:` compte comme réussi). `ci-ok` est l'unique contrôle à rendre obligatoire.
#   - PR vers main : kind et mesh seulement si le chemin cluster change ou si l'étiquette `e2e` est posée ;
#   - nuit (main) et déclenchement manuel : suite e2e complète ;
#   - `test` (cargo test, qui lit docs/ et deploy/) tourne toujours.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  schedule:
    - cron: "43 2 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      netns: ${{ steps.diff.outputs.netns }}
      e2e: ${{ steps.diff.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: ./scripts/test-ci-changes.sh
      - id: diff
        run: ./scripts/ci-changes.sh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked
        env:
          INSTA_UPDATE: "no"

  monitoring:
    # Règles d'alerte livrées : promtool check rules et test rules (spec §9.6, MON-07).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: >-
          docker run --rm -v "$PWD:/w" -w /w --entrypoint /bin/sh
          prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
          scripts/check-monitoring.sh

  e2e-netns:
    # Interception transparente réelle (iptables + SO_ORIGINAL_DST) dans un namespace jetable.
    needs: changes
    if: needs.changes.outputs.netns == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --workspace --bins --locked && cargo test -p mimic-proxy --test transparent --no-run --locked
      - run: sudo -E env "PATH=$PATH" ./scripts/e2e-netns.sh

  e2e-kind:
    # Démo OpenTelemetry sur kind, générateur de charge compris : injection par le webhook,
    # contrôleur, rapport de découverte dans le résumé du job, bascule en mock par mimicctl.
    # Seulement si le chemin cluster change (PR vers main), avec l'étiquette `e2e`, la nuit
    # ou à la demande.
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Les images de la démo (le générateur de charge embarque Playwright) ne tiennent pas
      # sur le disque du runner sans retirer les SDK préinstallés inutiles ici.
      - name: Place disque pour les images de la démo
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3 # zizmor: ignore[cache-poisoning] écriture limitée à main (save-if), rien de publié ici ; à revoir avant 2027-04-30
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: mimic:e2e
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: init
          load: true
          tags: mimic-init:e2e
          cache-from: type=gha
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: v0.27.0
          node_image: kindest/node:v1.32.2
          cluster_name: mimic
          config: tests/e2e/kind.yaml
      - run: cargo build -p mimicctl --locked
      - run: ./scripts/e2e-kind.sh
        env:
          MIMIC_IMAGE: mimic:e2e
          MIMICCTL: target/debug/mimicctl
          SKIP_BUILD: "1"
          LOAD_SECONDS: "300"
          REPORT_DIR: target/e2e-report
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-report
          path: target/e2e-report/
          if-no-files-found: ignore

  e2e-mesh:
    # Mimic dans un service mesh sur kind (spec §3.3, E2E-08 et E2E-09) : Istio en sidecar
    # et en ambient, Linkerd. Mêmes conditions que e2e-kind.
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mesh: [istio, linkerd]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3 # zizmor: ignore[cache-poisoning] écriture limitée à main (save-if), rien de publié ici ; à revoir avant 2027-04-30
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: mimic:e2e
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: init
          load: true
          tags: mimic-init:e2e
          cache-from: type=gha
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: v0.27.0
          node_image: kindest/node:v1.32.2
          cluster_name: mimic
          config: tests/e2e/kind.yaml
      - run: cargo build -p mimicctl --locked
      - run: ./scripts/e2e-mesh.sh "$MESH"
        env:
          MESH: ${{ matrix.mesh }}
          MIMIC_IMAGE: mimic:e2e
          MIMICCTL: target/debug/mimicctl
          SKIP_BUILD: "1"

  ci-ok:
    # Unique contrôle à rendre obligatoire. `if: always()` est indispensable : sans lui, un
    # job en échec ferait ignorer celui-ci, ce qui compte comme un succès.
    if: always()
    needs: [changes, test, monitoring, e2e-netns, e2e-kind, e2e-mesh]
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 2
    steps:
      - run: echo "$NEEDS" | jq -e '.changes.result == "success" and all(.[]; .result == "success" or .result == "skipped")'
        env:
          NEEDS: ${{ toJSON(needs) }}

  nightly-alert:
    # Une nuit rouge ne doit pas passer inaperçue : ouvre (ou commente) une issue `nightly-red`.
    needs: ci-ok
    if: always() && github.event_name == 'schedule' && needs.ci-ok.result != 'success'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    timeout-minutes: 5
    steps:
      - run: |
          gh label create nightly-red --repo "$REPO" --color B60205 --description "Exécution nocturne en échec" 2>/dev/null || true
          existing="$(gh issue list --repo "$REPO" --label nightly-red --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "Nouvelle exécution nocturne en échec : $RUN_URL"
          else
            gh issue create --repo "$REPO" --label nightly-red --title "CI nocturne en échec" --body "L'exécution nocturne a échoué : $RUN_URL"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
