name: ci

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
        env:
          INSTA_UPDATE: "no"

  monitoring:
    # Règles d'alerte livrées : promtool check rules et test rules (spec §9.6, MON-07).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: >-
          docker run --rm -v "$PWD:/w" -w /w --entrypoint /bin/sh
          prom/prometheus:v3.5.0 scripts/check-monitoring.sh

  e2e-netns:
    # Interception transparente réelle (iptables + SO_ORIGINAL_DST) dans un namespace jetable.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --bins && cargo test -p mimic-proxy --test transparent --no-run
      - run: sudo -E env "PATH=$PATH" ./scripts/e2e-netns.sh

  e2e-kind:
    # Démo OpenTelemetry sur kind, générateur de charge compris : injection par le webhook,
    # contrôleur, rapport de découverte dans le résumé du job, bascule en mock par mimicctl.
    # Uniquement sur les PR vers main.
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # Les images de la démo (le générateur de charge embarque Playwright) ne tiennent pas
      # sur le disque du runner sans retirer les SDK préinstallés inutiles ici.
      - name: Place disque pour les images de la démo
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: mimic:e2e
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: helm/kind-action@v1
        with:
          version: v0.27.0
          node_image: kindest/node:v1.32.2
          cluster_name: mimic
          config: tests/e2e/kind.yaml
      - run: cargo build -p mimicctl
      - run: ./scripts/e2e-kind.sh
        env:
          MIMIC_IMAGE: mimic:e2e
          MIMICCTL: target/debug/mimicctl
          SKIP_BUILD: "1"
          LOAD_SECONDS: "300"
          REPORT_DIR: target/e2e-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: target/e2e-report/
          if-no-files-found: ignore

  e2e-mesh:
    # Mimic dans un service mesh sur kind (spec §3.3, E2E-08 et E2E-09) : Istio en sidecar
    # et en ambient, Linkerd. Uniquement sur les PR vers main.
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mesh: [istio, linkerd]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: mimic:e2e
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: helm/kind-action@v1
        with:
          version: v0.27.0
          node_image: kindest/node:v1.32.2
          cluster_name: mimic
          config: tests/e2e/kind.yaml
      - run: cargo build -p mimicctl
      - run: ./scripts/e2e-mesh.sh ${{ matrix.mesh }}
        env:
          MIMIC_IMAGE: mimic:e2e
          MIMICCTL: target/debug/mimicctl
          SKIP_BUILD: "1"
