name: ci

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
        env:
          INSTA_UPDATE: "no"

  e2e-netns:
    # Interception transparente réelle (iptables + SO_ORIGINAL_DST) dans un namespace jetable.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --bins && cargo test -p mimic-proxy --test transparent --no-run
      - run: sudo -E env "PATH=$PATH" ./scripts/e2e-netns.sh

  e2e-kind:
    # Démo OpenTelemetry (shipping → quote) sur kind : injection par le webhook, contrôleur,
    # bascule en mock par mimicctl. Sur les PR vers main et après chaque merge.
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: mimic:e2e
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: helm/kind-action@v1
        with:
          version: v0.27.0
          node_image: kindest/node:v1.32.2
          cluster_name: mimic
          config: tests/e2e/kind.yaml
      - run: cargo build -p mimicctl
      - run: ./scripts/e2e-kind.sh
        env:
          MIMIC_IMAGE: mimic:e2e
          MIMICCTL: target/debug/mimicctl
          SKIP_BUILD: "1"
