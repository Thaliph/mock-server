name: ci

# Dependent stages (spec FND-10):
#   lint ──▶ test ──▶ image ──▶ e2e
#   chart ─────────────────────▲
#   security (cargo deny, zizmor)
#   changes ──▶ fuzz (HTTP/1 codec, spec PRX-28; skipped unless a PR touches the codec)
# `ci-ok` sums them up; it is the only required check on main.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly: new advisories against an unchanged tree.
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  IMAGE: ghcr.io/thaliph/mimic:ci
  INIT_IMAGE: ghcr.io/thaliph/mimic-init:ci

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }} # zizmor: ignore[cache-poisoning] cache written from main only, nothing is published by this job
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked

  test:
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }} # zizmor: ignore[cache-poisoning] cache written from main only, nothing is published by this job
      - run: cargo test --workspace --locked

  chart:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: helm lint --strict deploy/helm/mimic
      - run: helm template mimic deploy/helm/mimic -n mimic-system > /dev/null

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false

  image:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: app
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=app
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,scope=app,mode=max' || '' }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: init
          load: true
          tags: ${{ env.INIT_IMAGE }}
          cache-from: type=gha,scope=init
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,scope=init,mode=max' || '' }}
      - run: ./scripts/check-image.sh "$IMAGE"
      - run: ./scripts/check-init-image.sh "$INIT_IMAGE"
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.INIT_IMAGE }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - run: docker save "$IMAGE" "$INIT_IMAGE" -o image.tar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: image.tar
          retention-days: 1

  e2e:
    name: e2e (${{ matrix.name }})
    needs: [image, chart]
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Kubernetes floor of the supported range (INJ-17), and kind's default node image.
          - name: kubernetes-1.33
            node_image: kindest/node:v1.33.7@sha256:d26ef333bdb2cbe9862a0f7c3803ecc7b4303d8cea8e814b481b09949d353040
          - name: kubernetes-latest
            node_image: ""
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
      - run: docker load -i image.tar
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: v0.33.0
          node_image: ${{ matrix.node_image }}
          cluster_name: mimic-e2e
      - run: ./scripts/e2e.sh
        env:
          SKIP_BUILD: "1"

  # Path filter for the fuzz job: only a pull request that touches the HTTP/1 codec or the
  # fuzz crate runs it. Other events leave `codec` empty.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      codec: ${{ steps.filter.outputs.codec }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the base commit must be in the history to diff against it
          persist-credentials: false
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=false
          if [ "$EVENT" = pull_request ] && [ -n "$(git diff --name-only "$BASE" HEAD -- crates/mimic-core/src/proxy/http1 fuzz)" ]; then
            changed=true
          fi
          echo "codec=$changed" >> "$GITHUB_OUTPUT"

  fuzz:
    # PRX-28: 60 s on a pull request that touches the codec, 10 min on the weekly schedule.
    # Skipped otherwise; `ci-ok` accepts that skip (and only that one).
    name: fuzz (http1)
    needs: changes
    if: github.event_name == 'schedule' || (github.event_name == 'pull_request' && needs.changes.outputs.codec == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FUZZ_SECONDS: ${{ github.event_name == 'schedule' && 600 || 60 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: nightly-2026-10-24
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-fuzz@0.13.2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
          save-if: ${{ github.ref == 'refs/heads/main' }} # zizmor: ignore[cache-poisoning] cache written from main only, nothing is published by this job
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/http1
          key: fuzz-corpus-http1-${{ github.run_id }}
          restore-keys: fuzz-corpus-http1-
      - name: Fuzz the HTTP/1 codec
        working-directory: fuzz
        # cargo-fuzz defaults to the target it was built for; the prebuilt binary is musl, which
        # the address sanitizer cannot use.
        # The corpus directory is missing on a cold cache; libFuzzer requires it to exist.
        run: >
          mkdir -p corpus/http1 &&
          cargo +nightly-2026-10-24 fuzz run --target x86_64-unknown-linux-gnu http1
          corpus/http1 seeds/http1 --
          -max_total_time=$FUZZ_SECONDS -max_len=262144 -timeout=10 -dict=http1.dict
      # The corpus grows on the weekly run only; PR runs read it and never write it.
      - if: github.event_name == 'schedule'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/http1
          key: fuzz-corpus-http1-${{ github.run_id }}
      # PRX-28: the crashing input is kept for triage.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-http1-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 14

  ci-ok:
    if: always()
    needs: [lint, test, chart, security, image, e2e, changes, fuzz]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      LINT: ${{ needs.lint.result }}
      TEST: ${{ needs.test.result }}
      CHART: ${{ needs.chart.result }}
      SECURITY: ${{ needs.security.result }}
      IMAGE: ${{ needs.image.result }}
      E2E: ${{ needs.e2e.result }}
      CHANGES: ${{ needs.changes.result }}
      FUZZ: ${{ needs.fuzz.result }}
      CODEC: ${{ needs.changes.outputs.codec }}
    steps:
      - name: All stages passed
        run: |
          echo "lint=$LINT test=$TEST chart=$CHART security=$SECURITY image=$IMAGE e2e=$E2E changes=$CHANGES fuzz=$FUZZ codec=$CODEC"
          for r in "$LINT" "$TEST" "$CHART" "$SECURITY" "$IMAGE" "$E2E" "$CHANGES"; do
            [ "$r" = success ] || exit 1
          done
          # fuzz may be skipped by its path filter; it may not be skipped when the codec changed.
          case "$FUZZ" in
            success) ;;
            skipped) [ "$CODEC" != true ] || exit 1 ;;
            *) exit 1 ;;
          esac
