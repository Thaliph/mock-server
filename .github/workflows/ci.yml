name: ci

# Dependent stages (spec FND-10):
#   changes ──▶ classifies the change (scripts/ci_plan.py, tested first); a job below runs only when a gate
#               of its categories is set. Every other event, an unknown path, a change under .github/ or to
#               scripts/ci_plan.py, and an empty diff set every gate.
#   lint ──▶ test                (in parallel:)
#   lint ──▶ image ──▶ e2e        e2e waits for the image and the chart stage, not for the tests
#   chart ─────────────────────▲   (e2e-load runs with e2e)
#   security (cargo deny, zizmor); supply chain (cooldown, vendored-ui, dependency-review, gitleaks, trivy-config, codeql)
#   changes ──▶ fuzz (HTTP/1 codec, spec PRX-28; its gate is the codec paths)
#           └─▶ fuzz-discovery (a matrix: recorder, egress set, mock, load plan and gRPC codec, spec DSC-23, PUL-20, MCK-20, LDT-18, GRP-10, MSH-13; same rule for their own paths)
# `ci-ok` sums them up; it is the only required check on main. It accepts a skipped job only when that
# job's gate is off, and never a skipped job of the ungated ones (gitleaks, dependency-review).
#
# Actions allowed in the repository settings (#273; Settings → Actions → General, or
# `gh api repos/Thaliph/mock-server/actions/permissions/selected-actions`). Keep this list and the
# setting in sync: every `uses:` here, and every action nested in one of them, must be allowed.
#   GitHub-owned (actions/*, github/*): allowed by the setting itself.
#   docker/*, aquasecurity/trivy-action, aquasecurity/setup-trivy (nested in trivy-action),
#   sigstore/cosign-installer, dtolnay/rust-toolchain, Swatinem/rust-cache,
#   EmbarkStudios/cargo-deny-action, zizmorcore/zizmor-action, helm/kind-action,
#   taiki-e/install-action, gitleaks/gitleaks-action, ossf/scorecard-action (scorecard.yml).

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly: new advisories against an unchanged tree.
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  IMAGE: ghcr.io/thaliph/mimic:ci
  INIT_IMAGE: ghcr.io/thaliph/mimic-init:ci

jobs:
  # The path filter (spec FND-10): scripts/ci_plan.py sets one gate per job, and the jobs below read
  # them. The tests of the classification run first, so a broken classifier fails here.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      full: ${{ steps.plan.outputs.full }}
      gate_lint: ${{ steps.plan.outputs.gate_lint }}
      gate_test: ${{ steps.plan.outputs.gate_test }}
      gate_codeql_rust: ${{ steps.plan.outputs.gate_codeql_rust }}
      gate_codeql_actions: ${{ steps.plan.outputs.gate_codeql_actions }}
      gate_security: ${{ steps.plan.outputs.gate_security }}
      gate_cooldown: ${{ steps.plan.outputs.gate_cooldown }}
      gate_vendored_ui: ${{ steps.plan.outputs.gate_vendored_ui }}
      gate_chart: ${{ steps.plan.outputs.gate_chart }}
      gate_trivy_config: ${{ steps.plan.outputs.gate_trivy_config }}
      gate_image: ${{ steps.plan.outputs.gate_image }}
      gate_e2e: ${{ steps.plan.outputs.gate_e2e }}
      gate_e2e_load: ${{ steps.plan.outputs.gate_e2e_load }}
      gate_fuzz_http1: ${{ steps.plan.outputs.gate_fuzz_http1 }}
      gate_fuzz_discovery: ${{ steps.plan.outputs.gate_fuzz_discovery }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the base commit must be in the history to diff against it
          persist-credentials: false
      - name: Classification tests (spec FND-10)
        run: python3 -I scripts/test_ci_plan.py
      - id: plan
        name: Classify the change
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          changed="$RUNNER_TEMP/changed.z"
          # --no-renames lists both sides of a rename; -z keeps every name intact.
          if [ "$EVENT" = pull_request ]; then
            git diff -z --name-only --no-renames "$BASE" HEAD > "$changed"
          else
            : > "$changed" # not read: every other event runs everything
          fi
          python3 -I scripts/ci_plan.py --event "$EVENT" --changed "$changed" >> "$GITHUB_OUTPUT"

  lint:
    needs: changes
    if: needs.changes.outputs.gate_lint == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # The added lines of the change (scripts/check-test-messages.sh): the pull request's base, or the previous tip of a push.
      BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the base commit must be in the history to diff against it
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }} # zizmor: ignore[cache-poisoning] cache written from main only, nothing is published by this job
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      # The asserts that a change adds must not print a secret-like or raw value (CodeQL cleartext logging).
      - name: Self-test of the assert message check
        run: bash scripts/test_check_test_messages.sh
      - name: Assert messages of the change
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # A push with no previous tip (first or force push: github.event.before is all zeros, or the
          # commit is no longer in the history) has no base to diff against: nothing to compare, as cooldown.
          if [[ $EVENT == push ]] && { [[ $BASE =~ ^0+$ ]] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; }; then
            echo "no previous tip on this push ($BASE): nothing to compare"
            exit 0
          fi
          scripts/check-test-messages.sh "$BASE"

  test:
    needs: [changes, lint]
    if: needs.changes.outputs.gate_test == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # Real-Valkey tests of the discovery store (spec §7.3) use this service container.
      MIMIC_TEST_VALKEY_URL: redis://127.0.0.1:6379
    # Valkey: the image and digest of images/Dockerfile (stage valkey, scripts/pinned-image.sh valkey).
    services:
      valkey:
        image: docker.io/valkey/valkey:9.0-alpine@sha256:2d04268dfa26ab31cfa3fdc538866e76438b2d00e41db41b8cb86d780ac5a416
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }} # zizmor: ignore[cache-poisoning] cache written from main only, nothing is published by this job
      - run: cargo test --workspace --locked

  chart:
    # Its gate also covers docs and spec: check-release.sh reads the wiki and check-chart.sh reads SPEC.md.
    # It runs before e2e too, so that e2e never waits on a skipped chart stage.
    needs: changes
    if: needs.changes.outputs.gate_chart == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: helm lint --strict deploy/helm/mimic
      - run: helm template mimic deploy/helm/mimic -n mimic-system > /dev/null
      # #271: the chart as the release pins it renders both mimic images by digest.
      - run: scripts/check-release-chart.sh
      # #273: the Valkey image of values.yaml and the kind node image match images/Dockerfile.
      - run: scripts/check-pins.sh
      # #378: the chart variants lint strictly, the default render is the golden file, the exporter and PodMonitor shape (MON-01).
      - run: scripts/check-chart.sh
      # #364 (REL-01): the workspace version, the chart version and appVersion are one semver version.
      - run: scripts/check-release.sh

  security:
    # cargo deny checks the Cargo files (rust); zizmor checks the workflows (workflows).
    needs: changes
    if: needs.changes.outputs.gate_security == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false

  # #269 (spec FND-10): the supply-chain checks, beyond the advisories of cargo deny. Their gates are
  # listed in scripts/ci_plan.py; the ungated ones (dependency-review, gitleaks) run on every event.
  cooldown:
    # A crate version that this change adds or bumps in a lockfile must be 14 days old on crates.io,
    # and so must an npm version in the Swagger UI lockfile (#239, UI-13), unless
    # scripts/cooldown-allowlist.toml lists it with a reason. A pull request is compared with
    # its base, a push with the previous tip; a schedule changes nothing to compare.
    needs: changes
    if: needs.changes.outputs.gate_cooldown == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the base commit must be in the history to be compared with
          persist-credentials: false
      - name: Crate cooldown
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) base=$PR_BASE ;;
            push) base=$PUSH_BEFORE ;;
            *) echo "nothing to compare on $EVENT"; exit 0 ;;
          esac
          if [[ $base =~ ^0+$ ]]; then
            echo "no previous tip on this push"
            exit 0
          fi
          python3 scripts/check-cooldown.py "$base" Cargo.lock fuzz/Cargo.lock crates/mimic-controller/ui/package-lock.json

  # #239 (spec §7.5, UI-13): the vendored Swagger UI is the locked npm tarball, byte for byte. The
  # offline tests of the script run first; then the check downloads the locked tarball from the npm
  # registry, verifies its sha512 and compares the committed files with it.
  vendored-ui:
    needs: changes
    if: needs.changes.outputs.gate_vendored_ui == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Swagger UI vendoring and npm cooldown tests (offline)
        run: |
          python3 -I scripts/test_vendor_swagger_ui.py
          python3 -I scripts/test_check_cooldown.py
          python3 -I scripts/test_check_dashboards.py
          python3 -I scripts/test_release_notes.py
      - name: Swagger UI vendoring check
        run: python3 -I scripts/vendor-swagger-ui.py --check

  # Ungated: cheap, and a docs-only change can add a dependency or a secret too.
  dependency-review:
    # Adding a crate or an action with a known vulnerability, or a licence outside the policy of
    # deny.toml, fails a pull request; the run summary lists the dependencies that it adds.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          allow-licenses: Apache-2.0, Apache-2.0 WITH LLVM-exception, MIT, MIT-0, BSD-2-Clause, BSD-3-Clause, ISC, Zlib, 0BSD, BSL-1.0, CC0-1.0, Unicode-3.0, CDLA-Permissive-2.0
          # #461: typing-extensions (a grpcio dependency of the e2e gRPC test image only, never shipped) is
          # PSF-2.0; the dependency graph reads its historical Python license text as GPL-1.0-or-later too.
          allow-dependencies-licenses: pkg:pypi/typing-extensions@4.16.0

  # Ungated: no secret in the commits under review, whatever they change.
  gitleaks:
    # No secret in the commits under review (the pull request's, or the commits of a push).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the history under review
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy-config:
    # Misconfigurations of the rendered chart and of the Dockerfile fail on HIGH and CRITICAL.
    # Accepted findings are listed, each with its reason, in .trivyignore.yaml.
    needs: changes
    if: needs.changes.outputs.gate_trivy_config == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Render the chart
        run: |
          mkdir -p rendered
          helm template mimic deploy/helm/mimic -n mimic-system > rendered/chart.yaml
      - name: Trivy config, rendered chart
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: rendered
          trivyignores: .trivyignore.yaml
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Trivy config, Dockerfile
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: Dockerfile
          trivyignores: .trivyignore.yaml
          severity: HIGH,CRITICAL
          exit-code: "1"

  # CodeQL for the Rust code (rust) and for the GitHub Actions workflows (workflows); findings go to
  # code scanning. Two jobs, one per language, so that each has its own gate.
  codeql-rust:
    name: codeql (rust)
    needs: changes
    if: needs.changes.outputs.gate_codeql_rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: rust
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:rust

  codeql-actions:
    name: codeql (actions)
    needs: changes
    if: needs.changes.outputs.gate_codeql_actions == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: actions
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:actions

  image:
    # Runs for a change to the Rust code, the image inputs, the chart or e2e (the e2e stages need its
    # artifact). It runs in parallel with test: it waits for lint (the cheap format and clippy check) and for
    # changes only. ci-ok still requires test to succeed.
    needs: [changes, lint]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.gate_image == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: app
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=app
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,scope=app,mode=max' || '' }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: init
          load: true
          tags: ${{ env.INIT_IMAGE }}
          cache-from: type=gha,scope=init
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,scope=init,mode=max' || '' }}
      - run: ./scripts/check-image.sh "$IMAGE"
      - run: ./scripts/check-init-image.sh "$INIT_IMAGE"
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          trivyignores: .trivyignore.yaml
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.INIT_IMAGE }}
          trivyignores: .trivyignore.yaml
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      # #273: the Valkey image the chart deploys (it stores every recorded sample) is scanned too.
      - name: Valkey image reference (images/Dockerfile)
        run: echo "VALKEY_IMAGE=$(scripts/pinned-image.sh valkey)" >> "$GITHUB_ENV"
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.VALKEY_IMAGE }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - run: docker save "$IMAGE" "$INIT_IMAGE" -o image.tar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: image.tar
          retention-days: 1

  e2e:
    name: e2e (${{ matrix.name }})
    # Runs with the image artifact and the chart stage it deploys; both must have succeeded.
    needs: [changes, image, chart]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.gate_e2e == 'true' && needs.image.result == 'success' && needs.chart.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Kubernetes floor of the supported range (INJ-17), and kind's default node image.
          - name: kubernetes-1.33
            node_image: kindest/node:v1.33.12@sha256:3f5c8443c620245e4d355cfe09e96a91ead32ceaa569d3f1ca9edf0cb2fe2ff4
          - name: kubernetes-latest
            node_image: ""
    runs-on: ubuntu-24.04
    # The full suite takes about 35 minutes since the load test of F11 (ldt_16, #259) and the bundled monitoring
    # (mon_21, #379, #380); room for runner variance.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
      - run: docker load -i image.tar
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: v0.33.0
          node_image: ${{ matrix.node_image }}
          cluster_name: mimic-e2e
      - run: ./scripts/e2e.sh
        env:
          SKIP_BUILD: "1"

  # The load test's own checks (LDT-06, LDT-17: the chart without a cluster, the admission of MimicLoadTest and of the
  # generator's objects, RBAC of the controller). LDT-16 and LDT-19 (E) run inside e2e, after its F10 section.
  e2e-load:
    name: e2e-load (${{ matrix.name }})
    needs: [changes, image, chart]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.gate_e2e_load == 'true' && needs.image.result == 'success' && needs.chart.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: kubernetes-1.33
            node_image: kindest/node:v1.33.12@sha256:3f5c8443c620245e4d355cfe09e96a91ead32ceaa569d3f1ca9edf0cb2fe2ff4
          - name: kubernetes-latest
            node_image: ""
    runs-on: ubuntu-24.04
    # The objects of LDT-17 come from the mimic-core example (cargo run), so the Rust toolchain of lint is needed.
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }} # zizmor: ignore[cache-poisoning] cache written from main only, nothing is published by this job
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
      - run: docker load -i image.tar
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: v0.33.0
          node_image: ${{ matrix.node_image }}
          cluster_name: mimic-e2e
      # IMAGE and INIT_IMAGE (workflow env) name the images of the artifact.
      - run: ./scripts/e2e-load.sh
        env:
          SKIP_BUILD: "1"

  # Path filters for the fuzz jobs (spec PRX-28, DSC-23, PUL-20, MCK-20, LDT-18): the gates come from
  # scripts/ci_plan.py, which lists the paths of each target (the codec, the discovery, mock and load
  # modules, and the fuzz crate).
  fuzz:
    # PRX-28: 60 s on a pull request that touches the codec, 10 min on the weekly schedule.
    # Skipped otherwise; `ci-ok` accepts that skip, as its gate is off.
    name: fuzz (http1)
    needs: changes
    if: needs.changes.outputs.gate_fuzz_http1 == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FUZZ_SECONDS: ${{ github.event_name == 'schedule' && 600 || 60 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: nightly-2026-10-24
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-fuzz@0.13.2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
          save-if: ${{ github.ref == 'refs/heads/main' }} # zizmor: ignore[cache-poisoning] cache written from main only, nothing is published by this job
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/http1
          key: fuzz-corpus-http1-${{ github.run_id }}
          restore-keys: fuzz-corpus-http1-
      - name: Fuzz the HTTP/1 codec
        working-directory: fuzz
        # cargo-fuzz defaults to the target it was built for; the prebuilt binary is musl, which
        # the address sanitizer cannot use.
        # The corpus directory is missing on a cold cache; libFuzzer requires it to exist.
        run: >
          mkdir -p corpus/http1 &&
          cargo +nightly-2026-10-24 fuzz run --target x86_64-unknown-linux-gnu http1
          corpus/http1 seeds/http1 --
          -max_total_time=$FUZZ_SECONDS -max_len=262144 -timeout=10 -dict=http1.dict
      # The corpus grows on the weekly run only; PR runs read it and never write it.
      - if: github.event_name == 'schedule'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/http1
          key: fuzz-corpus-http1-${{ github.run_id }}
      # PRX-28: the crashing input is kept for triage.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-http1-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 14

  fuzz-discovery:
    # DSC-23, PUL-20, MCK-20, LDT-18: one job per target (the recorder, the egress set, the mock, the load plan), so that
    # each has its own time limit and corpus: 60 s on a pull request that touches the discovery
    # or mock modules, 10 min on the weekly schedule. Skipped otherwise; `ci-ok` accepts that skip,
    # as its gate is off, and sums the matrix jobs up as one result.
    name: fuzz (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.gate_fuzz_discovery == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target: [discovery, egress, mock, load, grpc, mesh]
    env:
      FUZZ_SECONDS: ${{ github.event_name == 'schedule' && 600 || 60 }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: nightly-2026-10-24
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-fuzz@0.13.2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
          save-if: ${{ github.ref == 'refs/heads/main' }} # zizmor: ignore[cache-poisoning] cache written from main only, nothing is published by this job
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Fuzz the target
        working-directory: fuzz
        # cargo-fuzz defaults to the target it was built for; the prebuilt binary is musl, which
        # the address sanitizer cannot use.
        # The corpus directory is missing on a cold cache; libFuzzer requires it to exist.
        run: >
          mkdir -p "corpus/$TARGET" &&
          cargo +nightly-2026-10-24 fuzz run --target x86_64-unknown-linux-gnu "$TARGET"
          "corpus/$TARGET" "seeds/$TARGET" --
          -max_total_time=$FUZZ_SECONDS -max_len=262144 -timeout=10
      # The corpus grows on the weekly run only; PR runs read it and never write it.
      - if: github.event_name == 'schedule'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
      # DSC-23: the crashing input is kept for triage.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.target }}-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 14

  ci-ok:
    if: always()
    needs: [changes, lint, test, chart, security, cooldown, vendored-ui, dependency-review, gitleaks, trivy-config, codeql-rust, codeql-actions, image, e2e, e2e-load, fuzz, fuzz-discovery]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    env:
      CHANGES: ${{ needs.changes.result }}
      LINT: ${{ needs.lint.result }}
      TEST: ${{ needs.test.result }}
      CHART: ${{ needs.chart.result }}
      SECURITY: ${{ needs.security.result }}
      COOLDOWN: ${{ needs.cooldown.result }}
      VENDORED_UI: ${{ needs.vendored-ui.result }}
      DEPENDENCY_REVIEW: ${{ needs.dependency-review.result }}
      GITLEAKS: ${{ needs.gitleaks.result }}
      TRIVY_CONFIG: ${{ needs.trivy-config.result }}
      CODEQL_RUST: ${{ needs.codeql-rust.result }}
      CODEQL_ACTIONS: ${{ needs.codeql-actions.result }}
      IMAGE: ${{ needs.image.result }}
      E2E: ${{ needs.e2e.result }}
      E2E_LOAD: ${{ needs.e2e-load.result }}
      FUZZ: ${{ needs.fuzz.result }}
      FUZZ_DISCOVERY: ${{ needs.fuzz-discovery.result }}
      # The gates, as the change set them ("true" or "false"); a gate is "" when `changes` failed.
      GATE_LINT: ${{ needs.changes.outputs.gate_lint }}
      GATE_TEST: ${{ needs.changes.outputs.gate_test }}
      GATE_CHART: ${{ needs.changes.outputs.gate_chart }}
      GATE_SECURITY: ${{ needs.changes.outputs.gate_security }}
      GATE_COOLDOWN: ${{ needs.changes.outputs.gate_cooldown }}
      GATE_VENDORED_UI: ${{ needs.changes.outputs.gate_vendored_ui }}
      GATE_TRIVY_CONFIG: ${{ needs.changes.outputs.gate_trivy_config }}
      GATE_CODEQL_RUST: ${{ needs.changes.outputs.gate_codeql_rust }}
      GATE_CODEQL_ACTIONS: ${{ needs.changes.outputs.gate_codeql_actions }}
      GATE_IMAGE: ${{ needs.changes.outputs.gate_image }}
      GATE_E2E: ${{ needs.changes.outputs.gate_e2e }}
      GATE_E2E_LOAD: ${{ needs.changes.outputs.gate_e2e_load }}
      GATE_FUZZ_HTTP1: ${{ needs.changes.outputs.gate_fuzz_http1 }}
      GATE_FUZZ_DISCOVERY: ${{ needs.changes.outputs.gate_fuzz_discovery }}
    steps:
      - name: All stages passed
        run: |
          fail=0
          # check <job> <result> <gate>: the job succeeded, or it was skipped while its gate is off.
          # An empty gate (an ungated job, or a missing output) never accepts a skip.
          check() {
            case "$2" in
              success) ;;
              skipped)
                if [ "$3" != false ]; then
                  echo "$1: skipped, but its gate is '$3'" >&2
                  fail=1
                fi
                ;;
              *) echo "$1: $2" >&2; fail=1 ;;
            esac
          }
          check changes "$CHANGES" ""
          check lint "$LINT" "$GATE_LINT"
          check test "$TEST" "$GATE_TEST"
          check chart "$CHART" "$GATE_CHART"
          check security "$SECURITY" "$GATE_SECURITY"
          check cooldown "$COOLDOWN" "$GATE_COOLDOWN"
          check vendored-ui "$VENDORED_UI" "$GATE_VENDORED_UI"
          check dependency-review "$DEPENDENCY_REVIEW" ""
          check gitleaks "$GITLEAKS" ""
          check trivy-config "$TRIVY_CONFIG" "$GATE_TRIVY_CONFIG"
          check codeql-rust "$CODEQL_RUST" "$GATE_CODEQL_RUST"
          check codeql-actions "$CODEQL_ACTIONS" "$GATE_CODEQL_ACTIONS"
          check image "$IMAGE" "$GATE_IMAGE"
          check e2e "$E2E" "$GATE_E2E"
          check e2e-load "$E2E_LOAD" "$GATE_E2E_LOAD"
          check fuzz "$FUZZ" "$GATE_FUZZ_HTTP1"
          check fuzz-discovery "$FUZZ_DISCOVERY" "$GATE_FUZZ_DISCOVERY"
          echo "gates: lint=$GATE_LINT test=$GATE_TEST chart=$GATE_CHART security=$GATE_SECURITY cooldown=$GATE_COOLDOWN vendored-ui=$GATE_VENDORED_UI trivy-config=$GATE_TRIVY_CONFIG codeql-rust=$GATE_CODEQL_RUST codeql-actions=$GATE_CODEQL_ACTIONS image=$GATE_IMAGE e2e=$GATE_E2E e2e-load=$GATE_E2E_LOAD fuzz=$GATE_FUZZ_HTTP1 fuzz-discovery=$GATE_FUZZ_DISCOVERY"
          exit "$fail"
