# Dependency updates: crates (workspace and fuzz crate), the npm lockfile of the vendored Swagger UI
# (#239, UI-13), GitHub Actions, and Dockerfile base images
# (the product Dockerfile and images/Dockerfile, which pins Valkey, kind and the e2e images, #273).
# The 14-day cooldown (#269, as scripts/check-cooldown.py) keeps freshly published (possibly compromised) releases out.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: {interval: weekly}
    cooldown: {default-days: 14}
    groups:
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /fuzz
    schedule: {interval: weekly}
    cooldown: {default-days: 14}
    groups:
      cargo-fuzz:
        patterns: ["*"]
        update-types: [minor, patch]
  # Swagger UI (#239, UI-13): a bump needs scripts/vendor-swagger-ui.py and a reviewed diff of the vendored files.
  - package-ecosystem: npm
    directory: /crates/mimic-controller/ui
    schedule: {interval: weekly}
    cooldown: {default-days: 14}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    cooldown: {default-days: 14}
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule: {interval: weekly}
    cooldown: {default-days: 14}
  # images/Dockerfile: never built, only the digests of the pinned images, read by Dependabot.
  - package-ecosystem: docker
    directory: /images
    schedule: {interval: weekly}
    cooldown: {default-days: 14}
    ignore:
      # The floor of the e2e Kubernetes matrix (1.33): patch updates only (#287).
      - dependency-name: kindest/node
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # e2e clients stay on LTS lines, moved by hand (#286, #289).
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
