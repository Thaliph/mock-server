[package]
name = "mimic-controller"
description = "Plan de contrôle de mimic : agrégation par workload, interface de découverte, snapshots de mock et bascule de mode"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = "0.8.9"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = "0.3.34"
http = "1.5.0"
hyper = { version = "1.12.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server-auto", "http1", "service"] }
k8s-openapi = { version = "0.28.0", features = ["v1_32"] }
kube = { version = "4.2.0", default-features = false, features = ["client", "rustls-tls", "ring", "runtime", "derive"] }
mimic-core = { version = "0.1.0", path = "../mimic-core" }
object_store = { version = "0.14.2", features = ["aws"] }
prometheus-client = "0.25.1"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1.15.1", features = ["std"] }
schemars = "1"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_yaml = "0.9.34"
sha2.workspace = true
tokio = { version = "1.53.3", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
ulid = "3.0.0"

[dev-dependencies]
async-trait = "0.1.92"
reqwest = { version = "0.13.5", features = ["json"] }
tempfile = "3.27.0"

[lints]
workspace = true
