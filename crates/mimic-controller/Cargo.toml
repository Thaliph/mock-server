[package]
name = "mimic-controller"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
futures = "0.3.34"
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server-auto", "service", "http1"] }
k8s-openapi = { version = "0.29.0", features = ["v1_33"] }
# kube 4.2 still builds on k8s-openapi 0.28, which needs its own version feature.
k8s-openapi-kube = { package = "k8s-openapi", version = "0.28.0", features = ["v1_33"] }
kube = { version = "4.2.0", default-features = false, features = ["client", "runtime", "ring"] }
mimic-core = { version = "0.1.0", path = "../mimic-core" }
mimic-runtime = { version = "0.1.0", path = "../mimic-runtime" }
prometheus-client = "0.25.2"
redis = { version = "1.8.1", features = ["tokio-comp"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1.15.1"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util", "signal"] }
tokio-rustls = "0.26.6"
tracing = "0.1.44"

[lints]
workspace = true

[dev-dependencies]
http-body-util = "0.1.5"
mimic-runtime = { path = "../mimic-runtime", features = ["testing"] }
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
serde_json = "1.0.154"
tokio-rustls = "0.26.6"
tower = { version = "0.5.3", features = ["util"] }
tracing-subscriber = { version = "0.3.23", features = ["json"] }
