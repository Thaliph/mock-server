[package]
name = "mimic-controller"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
futures = "0.3.34"
hkdf = "0.13.0"
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server-auto", "service", "http1"] }
json-patch = "4.2.0"
k8s-openapi = { version = "0.28.0", features = ["v1_33"] }
kube = { version = "4.2.0", default-features = false, features = ["client", "runtime", "ring", "rustls-tls", "jsonpatch"] }
mimic-core = { version = "0.1.0", path = "../mimic-core" }
mimic-runtime = { version = "0.1.0", path = "../mimic-runtime" }
p256 = { version = "0.14.0", features = ["pkcs8"] }
prometheus-client = "0.25.2"
rand = "0.10.3"
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem", "x509-parser"] }
redis = { version = "1.8.1", features = ["tokio-comp"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1.15.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
sha2 = "0.11.1"
time = "0.3.55"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util", "signal"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tracing = "0.1.44"
x509-parser = "0.18.1"
zeroize = "1.9.1"

[lints]
workspace = true

[dev-dependencies]
http = "1.5.0"
http-body-util = "0.1.5"
mimic-runtime = { path = "../mimic-runtime", features = ["testing"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["test-util"] }
tower = { version = "0.5.3", features = ["util"] }
tracing-subscriber = { version = "0.3.23", features = ["json"] }
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
