[package]
name = "mimicctl"
description = "CLI de mimic : bascule des workloads, statut, export OpenAPI, requêtes enregistrées et diff de specs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["http1", "client"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
k8s-openapi = { version = "0.28.0", features = ["v1_32"] }
kube = { version = "4.2.0", default-features = false, features = ["client", "rustls-tls", "ring", "ws"] }
mimic-controller = { version = "0.1.0", path = "../mimic-controller" }
mimic-core = { version = "0.1.0", path = "../mimic-core" }
serde_json.workspace = true
serde_yaml = "0.9.34"
tokio = { version = "1.53.3", features = ["full"] }

[lints]
workspace = true
