[package]
name = "mimic-cni"
description = "Plugin CNI chaîné de mimic : règles de redirection posées sans conteneur privilégié dans le pod"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
k8s-openapi = { version = "0.28.0", features = ["v1_32"] }
kube = { version = "4.2.0", default-features = false, features = ["client", "rustls-tls", "ring"] }
mimic-init = { version = "0.1.0", path = "../mimic-init" }
nix = { version = "0.31.3", features = ["sched"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde_json.workspace = true
tokio = { version = "1.53.3", features = ["rt", "macros", "signal", "time"] }

[dev-dependencies]
serde = { workspace = true }
serde_yaml = "0.9.34"
tempfile = "3.27.0"

[lints]
workspace = true
