[package]
name = "mimic-net"
description = "Serveurs HTTPS du plan de contrôle de mimic (webhook, contrôleur) : certificat relu à chaud, connexions bornées, arrêt propre"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = "0.8.9"
hyper-util = { version = "0.1.21", features = ["tokio", "server-auto", "http1", "http2", "service"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1.15.1", features = ["std"] }
serde = { workspace = true, features = ["derive"] }
tokio = { version = "1.53.3", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tracing = "0.1.44"

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["pem", "ring"] }
reqwest = { version = "0.13.5", features = ["json"] }
serde_yaml = "0.9.34"
tempfile = "3.27.0"

[lints]
workspace = true
