[package]
name = "mimic-sidecar"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = "0.8.9"
mimic-runtime = { version = "0.1.0", path = "../mimic-runtime" }
nix = { version = "0.31.3", default-features = false, features = ["net", "resource"] }
prometheus-client = "0.25.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
socket2 = { version = "0.6.5", features = ["all"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
tracing = "0.1.44"

[lints]
workspace = true

[dev-dependencies]
mimic-runtime = { path = "../mimic-runtime", features = ["testing"] }
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tower = { version = "0.5", features = ["util"] }
