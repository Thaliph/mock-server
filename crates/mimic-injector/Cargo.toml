[package]
name = "mimic-injector"
description = "Webhook d'admission qui injecte l'init container iptables et le sidecar mimic dans les pods"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = "0.8.9"
base64.workspace = true
clap = { version = "4.6.7", features = ["derive", "env"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server-auto", "http1", "service"] }
json-patch = "4.2.0"
k8s-openapi = { version = "0.28.0", features = ["v1_32"] }
kube = { version = "4.2.0", default-features = false, features = ["admission"] }
mimic-proxy = { version = "0.1.0", path = "../mimic-proxy" }
prometheus-client = "0.25.1"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1.15.1", features = ["std"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_yaml = "0.9.34"
tokio = { version = "1.53.3", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["pem", "ring"] }
reqwest = { version = "0.13.5", features = ["json"] }
tempfile = "3.27.0"

[lints]
workspace = true
