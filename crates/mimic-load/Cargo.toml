[package]
name = "mimic-load"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bytes = "1.12.1"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
mimic-core = { version = "0.1.0", path = "../mimic-core" }
mimic-runtime = { version = "0.1.0", path = "../mimic-runtime" }
prometheus-client = "0.25.2"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "fs"] }
tracing = "0.1.44"

[lints]
workspace = true

[dev-dependencies]
hyper = { version = "1.12.0", features = ["server", "client", "http1"] }
mimic-runtime = { path = "../mimic-runtime", features = ["testing"] }
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
tempfile = "3.27.0"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
