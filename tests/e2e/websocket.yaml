# WebSocket en mock (E2E-07, scripts/e2e-kind.sh) : un serveur WebSocket non injecté qui
# compte ce qu'il reçoit, et un client curl injecté dont le sidecar passe en mock.
#
# Le serveur tourne sur l'image de recommendation de la démo (Python), déjà présente sur le
# nœud : aucune image à télécharger. Il ne dépend que de la bibliothèque standard.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ws-echo
  namespace: otel-demo
data:
  server.py: |
    # Serveur WebSocket minimal : poignée de main RFC 6455, puis connexion gardée ouverte
    # jusqu'à sa fermeture par le client (les trames sont ignorées). GET /count renvoie
    # « <connexions> <poignées de main> », sans compter cette requête elle-même.
    import base64, hashlib, socketserver, sys, threading

    GUID = "258EAFA5-E914-47DA-95CA-C5AB0DC85B11"
    lock = threading.Lock()
    counts = {"connections": 0, "upgrades": 0}


    def reply(sock, status, body):
        sock.sendall(
            (
                "HTTP/1.1 %s\r\nContent-Type: text/plain\r\nContent-Length: %d\r\n"
                "Connection: close\r\n\r\n%s" % (status, len(body), body)
            ).encode()
        )


    class Handler(socketserver.BaseRequestHandler):
        def handle(self):
            data = b""
            while b"\r\n\r\n" not in data:
                chunk = self.request.recv(4096)
                if not chunk:
                    return
                data += chunk
            lines = data.split(b"\r\n\r\n", 1)[0].decode("latin-1").split("\r\n")
            parts = lines[0].split(" ")
            path = parts[1] if len(parts) > 1 else "/"
            headers = {}
            for line in lines[1:]:
                name, _, value = line.partition(":")
                headers[name.strip().lower()] = value.strip()
            if path == "/count":
                with lock:
                    body = "%d %d\n" % (counts["connections"], counts["upgrades"])
                reply(self.request, "200 OK", body)
                return
            with lock:
                counts["connections"] += 1
            key = headers.get("sec-websocket-key")
            if headers.get("upgrade", "").lower() != "websocket" or not key:
                reply(self.request, "400 Bad Request", "poignée de main WebSocket attendue\n")
                return
            with lock:
                counts["upgrades"] += 1
            print("poignée de main %s depuis %s" % (path, self.client_address[0]), flush=True)
            accept = base64.b64encode(hashlib.sha1((key + GUID).encode()).digest()).decode()
            self.request.sendall(
                (
                    "HTTP/1.1 101 Switching Protocols\r\nUpgrade: websocket\r\n"
                    "Connection: Upgrade\r\nSec-WebSocket-Accept: %s\r\n\r\n" % accept
                ).encode()
            )
            while self.request.recv(4096):
                pass


    class Server(socketserver.ThreadingTCPServer):
        allow_reuse_address = True
        daemon_threads = True


    with Server(("0.0.0.0", int(sys.argv[1]) if len(sys.argv) > 1 else 8080), Handler) as s:
        print("serveur WebSocket à l'écoute", flush=True)
        s.serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ws-echo
  namespace: otel-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ws-echo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ws-echo
      annotations:
        # La dépendance elle-même : ses compteurs disent ce qui l'a vraiment jointe.
        mimic.platform.io/inject: "false"
    spec:
      containers:
        - name: server
          image: ghcr.io/open-telemetry/demo:2.0.2-recommendation
          imagePullPolicy: IfNotPresent
          command: ["python3", "-u", "/ws/server.py", "8080"]
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: script
              mountPath: /ws
      volumes:
        - name: script
          configMap:
            name: ws-echo
---
apiVersion: v1
kind: Service
metadata:
  name: ws-echo
  namespace: otel-demo
spec:
  selector:
    app.kubernetes.io/name: ws-echo
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ws-client
  namespace: otel-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ws-client
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ws-client
    spec:
      containers:
        - name: curl
          image: curlimages/curl:8.11.1
          imagePullPolicy: IfNotPresent
          command: ["sleep", "infinity"]
