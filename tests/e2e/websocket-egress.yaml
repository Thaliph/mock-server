# E2E-07 : pendant le refus, ws-client ne peut joindre que le DNS et le contrôleur (battement
# du sidecar). Une poignée de main relayée vers ws-echo échouerait (502) au lieu du 503 du
# refus en mock.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ws-client-deny-egress
  namespace: otel-demo
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ws-client
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mimic-system
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
