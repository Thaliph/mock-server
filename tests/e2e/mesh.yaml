# Pods du test mesh (scripts/e2e-mesh.sh, E2E-08 et E2E-09), appliqués dans chaque
# namespace du mesh : un serveur HTTP et un client curl, injectés par le mesh et par mimic.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mesh-server
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: mesh-server}
  template:
    metadata:
      labels: {app.kubernetes.io/name: mesh-server}
    spec:
      containers:
        - name: echo
          image: hashicorp/http-echo:1.0
          args: ["-listen=:8080", "-text=pong"]
          ports:
            - {name: http, containerPort: 8080}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: mesh-server
spec:
  selector: {app.kubernetes.io/name: mesh-server}
  ports:
    - {name: http, port: 8080, targetPort: http, appProtocol: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mesh-client
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: mesh-client}
  template:
    metadata:
      labels: {app.kubernetes.io/name: mesh-client}
    spec:
      containers:
        - name: curl
          image: curlimages/curl:8.11.1
          command: ["sleep", "infinity"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
