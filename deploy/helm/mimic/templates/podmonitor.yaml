{{- if and .Values.metrics.podMonitor.enabled .Values.valkey.metrics.enabled }}
# Prometheus Operator PodMonitor of the Valkey exporter (spec §10.7, #378): the Valkey pods of this release,
# port `metrics` (9121). Scraped in the release namespace only.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ .Release.Name }}-valkey
  labels:
    {{- include "mimic.labels" . | nindent 4 }}
spec:
  namespaceSelector:
    matchNames: [{{ .Release.Namespace | quote }}]
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: mimic-valkey
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.metrics.podMonitor.interval }}
      relabelings:
        - targetLabel: job
          replacement: mimic-valkey
{{- end }}
