{{- if .Values.metrics.podMonitor.enabled }}
# Prometheus Operator PodMonitors (spec §10.7, MON-01, #378). Each scrapes the admin port by its name `mimic-admin`
# (15100), which the injected sidecar and the load generator declare (MON-03). Pods are selected by a label:
# the injection label `mimic.platform.io/deployment` (set on every injected pod, LDT-20) and the load test label
# `mimic.platform.io/load-test` (on every generator pod). The sidecar's series carry no namespace, pod or
# deployment by design, so the target labels add them.
# The sidecar monitor: injected pods.
{{- $sidecar := include "mimic.scrapeTarget" (dict "root" . "job" "mimic-sidecar") | fromJson }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ $sidecar.name }}
  labels:
    {{- include "mimic.labels" . | nindent 4 }}
spec:
  namespaceSelector:
    {{- toYaml .Values.metrics.podMonitor.namespaceSelector | nindent 4 }}
  selector:
    matchExpressions:
      {{- range $sidecar.exists }}
      - key: {{ . }}
        operator: Exists
      {{- end }}
  podMetricsEndpoints:
    - port: {{ $sidecar.port }}
      path: /metrics
      interval: {{ $sidecar.interval }}
      relabelings:
        {{- range $sidecar.relabel }}
        {{- if .source }}
        - sourceLabels: [{{ .source }}]
          targetLabel: {{ .target }}
        {{- else }}
        - targetLabel: {{ .target }}
          replacement: {{ .replacement }}
        {{- end }}
        {{- end }}
---
# The load generator monitor: mimic-load pods of a MimicLoadTest run (§7.8), labelled with their load test.
{{- $load := include "mimic.scrapeTarget" (dict "root" . "job" "mimic-load") | fromJson }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ $load.name }}
  labels:
    {{- include "mimic.labels" . | nindent 4 }}
spec:
  namespaceSelector:
    {{- toYaml .Values.metrics.podMonitor.namespaceSelector | nindent 4 }}
  selector:
    matchExpressions:
      {{- range $load.exists }}
      - key: {{ . }}
        operator: Exists
      {{- end }}
  podMetricsEndpoints:
    - port: {{ $load.port }}
      path: /metrics
      interval: {{ $load.interval }}
      relabelings:
        {{- range $load.relabel }}
        {{- if .source }}
        - sourceLabels: [{{ .source }}]
          targetLabel: {{ .target }}
        {{- else }}
        - targetLabel: {{ .target }}
          replacement: {{ .replacement }}
        {{- end }}
        {{- end }}
{{- if .Values.valkey.metrics.enabled }}
---
# The Valkey exporter monitor (spec §10.7, #378): the Valkey pods of this release, port `metrics` (9121), in the
# release namespace only.
{{- $valkey := include "mimic.scrapeTarget" (dict "root" . "job" "mimic-valkey") | fromJson }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ $valkey.name }}
  labels:
    {{- include "mimic.labels" . | nindent 4 }}
spec:
  namespaceSelector:
    matchNames: [{{ .Release.Namespace | quote }}]
  selector:
    matchLabels:
      {{- toYaml $valkey.matchLabels | nindent 6 }}
  podMetricsEndpoints:
    - port: {{ $valkey.port }}
      path: /metrics
      interval: {{ $valkey.interval }}
      relabelings:
        {{- range $valkey.relabel }}
        - targetLabel: {{ .target }}
          replacement: {{ .replacement }}
        {{- end }}
{{- end }}
{{- end }}
