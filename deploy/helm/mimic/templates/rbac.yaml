# Least privilege for the controller (spec §11): every grant is limited to the names this
# release creates. The only create is TokenReview (sidecar API authentication, spec §7.2).
# No pods, no Deployments, no other Secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-controller
  labels:
    {{- include "mimic.labels" . | nindent 4 }}
rules:
  - apiGroups: [mimic.platform.io]
    resources: [mimicworkloads]
    verbs: [get, list, watch]
  # The status of a MimicWorkload (spec §7.4), by server-side apply; no update of the object itself.
  - apiGroups: [mimic.platform.io]
    resources: [mimicworkloads/status]
    verbs: [patch]
  - apiGroups: [admissionregistration.k8s.io]
    resources: [mutatingwebhookconfigurations]
    # list and watch are limited by name too: the controller watches only its own configuration.
    resourceNames: [{{ include "mimic.webhookConfiguration" . }}]
    verbs: [get, list, watch, patch]
  # Authenticates the sidecar API callers: the API server checks their projected token (spec §7.2).
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
  {{- if .Values.loadTest.enabled }}
  # Load tests (spec §11, F11): the MimicLoadTest objects, the status of each, and the generator's
  # Job and NetworkPolicy, which the ValidatingAdmissionPolicy of loadtest-policy.yaml restricts to
  # the shape of spec §7.8 in injected namespaces. Pods and Secrets are not among them.
  - apiGroups: [mimic.platform.io]
    resources: [mimicloadtests]
    verbs: [get, list, watch]
  - apiGroups: [mimic.platform.io]
    resources: [mimicloadtests/status]
    verbs: [patch]
  # The ready pod addresses of a deployment's Service endpoints (spec §7.8, Targets).
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [list, watch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, list, watch, delete]
  {{- if .Values.loadTest.networkPolicy }}
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [create, delete]
  {{- end }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-controller
  labels:
    {{- include "mimic.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-controller
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-controller
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mimic.labels" . | nindent 4 }}
rules:
  # Read and replace the webhook Secret; the chart creates it, the controller fills it.
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ include "mimic.webhookSecret" . }}]
    verbs: [get, update]
  # Same for the TLS seed Secret (spec §5, §11); no other Secret.
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ include "mimic.tlsCaSecret" . }}]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mimic.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-controller
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-controller
    namespace: {{ .Release.Namespace }}
