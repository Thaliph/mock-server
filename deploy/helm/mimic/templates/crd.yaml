# MimicWorkload (spec §7, §7.1). F1 defines spec.deployment and spec.mode only.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: mimicworkloads.mimic.platform.io
  labels:
    {{- include "mimic.labels" . | nindent 4 }}
spec:
  group: mimic.platform.io
  scope: Namespaced
  names:
    kind: MimicWorkload
    listKind: MimicWorkloadList
    plural: mimicworkloads
    singular: mimicworkload
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [deployment]
              properties:
                deployment:
                  description: Name of the Deployment, in the same namespace, that this MimicWorkload selects. Immutable.
                  type: string
                  maxLength: 253
                  # DNS-1123 subdomain, the rule Kubernetes applies to Deployment names.
                  pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'
                  x-kubernetes-validations:
                    - rule: "self == oldSelf"
                      message: "spec.deployment is immutable"
                mode:
                  description: Mimic mode of the Deployment's pods.
                  type: string
                  enum: [discovery, mock]
                  default: discovery
