{{- if .Values.valkey.metrics.enabled }}
{{- $name := include "mimic.valkeyExporterSecret" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $password := "" }}
{{- if and $existing $existing.data (index $existing.data "password") }}
{{- $password = b64dec (index $existing.data "password") }}
{{- else }}
{{- $password = randAlphaNum 40 }}
{{- end }}
# The exporter's password (spec §10.7). Kept like the Valkey password: the same value on upgrade.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "mimic.labels" . | nindent 4 }}
  annotations:
    # Never deleted by helm, so the exporter keeps its password across a reinstall.
    helm.sh/resource-policy: keep
type: Opaque
data:
  password: {{ $password | b64enc }}
---
# The ACL file of the exporter user, mounted into Valkey (--aclfile). The password appears only as its
# SHA-256: `+info +ping` and `resetkeys resetchannels`, so the user reads no key and no channel.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mimic.valkeyAclSecret" . }}
  labels:
    {{- include "mimic.labels" . | nindent 4 }}
type: Opaque
data:
  aclfile: {{ printf "user mimic-exporter on #%s +info +ping resetkeys resetchannels\n" (sha256sum $password) | b64enc }}
{{- end }}
