# MimicConfig (spec §7, §7.9, M1): settings of the mesh for the Deployments and Services of its own
# namespace, attached by `targetRefs` (design §6). The controller writes `status` through the status
# subresource only. The CRD has no controller yet at M1: the view builder is pure code (#440).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: mimicconfigs.mimic.platform.io
  labels:
    {{- include "mimic.labels" . | nindent 4 }}
  annotations:
    # Kept on uninstall with the other CRDs: removing the objects is explicit (spec §7.1).
    helm.sh/resource-policy: keep
spec:
  group: mimic.platform.io
  scope: Namespaced
  names:
    kind: MimicConfig
    listKind: MimicConfigList
    plural: mimicconfigs
    singular: mimicconfig
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Accepted
          type: string
          jsonPath: .status.conditions[?(@.type=="Accepted")].status
        - name: Resolved
          type: string
          jsonPath: .status.conditions[?(@.type=="ResolvedRefs")].status
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            status:
              type: object
              properties:
                conditions:
                  type: array
                  maxItems: 8
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type:
                        type: string
                        enum: [Accepted, ResolvedRefs]
                      status:
                        type: string
                        enum: ["True", "False", Unknown]
                      reason:
                        description: "Accepted: Accepted, Conflicted, TargetNotFound, Invalid. ResolvedRefs: ResolvedRefs, RefNotPermitted."
                        type: string
                        maxLength: 64
                      message:
                        type: string
                        maxLength: 1024
                      observedGeneration: {type: integer, format: int64}
                      lastTransitionTime: {type: string, format: date-time}
            spec:
              type: object
              required: [targetRefs]
              properties:
                targetRefs:
                  description: >-
                    The Deployments and Services this object configures, in the namespace of the object (a
                    reference never leaves it). When several MimicConfigs target the same object the oldest wins
                    as a whole (spec §7).
                  type: array
                  minItems: 1
                  maxItems: 16
                  items:
                    type: object
                    required: [group, kind, name]
                    properties:
                      group:
                        type: string
                        enum: ["apps", ""]
                      kind:
                        type: string
                        enum: [Deployment, Service]
                      name:
                        type: string
                        minLength: 1
                        maxLength: 253
                      # Declared only so that CEL can see it and refuse it.
                      namespace:
                        type: string
                    x-kubernetes-validations:
                      - rule: "!has(self.namespace)"
                        message: "targetRefs are in the namespace of the MimicConfig: namespace must not be set"
                      - rule: "(self.kind == 'Deployment' && self.group == 'apps') || (self.kind == 'Service' && self.group == '')"
                        message: "targetRefs must be apps/Deployment or core/Service"
                destinations:
                  description: >-
                    Services outside the namespace that the Deployment targets call (at most 256). One is resolved
                    only when its namespace holds a ReferenceGrant from MimicConfig of this namespace to Service
                    (spec §7.9). Deployment targets only.
                  type: array
                  maxItems: 256
                  items:
                    type: object
                    required: [namespace, name]
                    properties:
                      namespace: {type: string, minLength: 1, maxLength: 63}
                      name: {type: string, minLength: 1, maxLength: 253}
                mesh:
                  description: Deployment targets only.
                  type: object
                  properties:
                    enabled:
                      description: "false: this workload's sidecar relays bytes and routes nothing (design §3.4)."
                      type: boolean
                      default: true
                loadBalancer:
                  description: Service targets only.
                  type: object
                  properties:
                    slowStart:
                      description: Slow start window of new endpoints, `<n>s`, 0s to 3600s; `0s` disables. Default 30s.
                      type: string
                      pattern: '^[0-9]{1,4}s$'
                  x-kubernetes-validations:
                    - rule: "!has(self.slowStart) || int(self.slowStart.replace('s', '')) <= 3600"
                      message: "loadBalancer.slowStart is at most 3600s"
                retries:
                  description: >-
                    Retries after the first try, 0 to 10; `0` disables retries and the fallback to the ClusterIP.
                    Default 3. Service targets only (spec §7.9).
                  type: integer
                  minimum: 0
                  maximum: 10
                retryBudget:
                  description: >-
                    Retries allowed over a window, per caller pod and Service: at most `percent` of the requests
                    plus `minPerSecond` per second (spec §7.9). Each absent field takes its default. Service
                    targets only.
                  type: object
                  properties:
                    percent:
                      description: Percent of the requests of the window, 0 to 100. Default 20.
                      type: integer
                      minimum: 0
                      maximum: 100
                    minPerSecond:
                      description: Retries per second allowed whatever the requests, 0 to 1000. Default 10.
                      type: integer
                      minimum: 0
                      maximum: 1000
                    window:
                      description: Length of the window, `<n>s`, 1s to 60s. Default 10s.
                      type: string
                      pattern: '^[0-9]{1,2}s$'
                  x-kubernetes-validations:
                    - rule: "!has(self.window) || (int(self.window.replace('s', '')) >= 1 && int(self.window.replace('s', '')) <= 60)"
                      message: "retryBudget.window is 1s to 60s"
                outlierDetection:
                  description: >-
                    Passive outlier detection of the endpoints of the Service, per caller pod (spec §7.9).
                    Each absent field takes its default. Service targets only.
                  type: object
                  properties:
                    consecutiveFailures:
                      description: Proxy-level failures in a row that eject an endpoint, 1 to 100. Default 5.
                      type: integer
                      minimum: 1
                      maximum: 100
                    consecutive5xx:
                      description: 5xx responses in a row that eject an endpoint, 0 to 100; `0` turns it off. Default 0.
                      type: integer
                      minimum: 0
                      maximum: 100
                    baseEjectionTime:
                      description: Time of the first ejection of an endpoint, `<n>s`, 1s to 300s; doubles for each next one. Default 30s.
                      type: string
                      pattern: '^[0-9]{1,3}s$'
                    maxEjectionPercent:
                      description: Share of the endpoints that may be ejected at once, rounded down, 0 to 100; `0` turns ejection off. Default 50.
                      type: integer
                      minimum: 0
                      maximum: 100
                  x-kubernetes-validations:
                    - rule: "!has(self.baseEjectionTime) || (int(self.baseEjectionTime.replace('s', '')) >= 1 && int(self.baseEjectionTime.replace('s', '')) <= 300)"
                      message: "outlierDetection.baseEjectionTime is 1s to 300s"
                circuitBreaker:
                  description: >-
                    Limits per caller pod and Service (spec §7.9). Each absent field takes its default. Service
                    targets only.
                  type: object
                  properties:
                    maxRequests:
                      description: Requests in flight above which new ones are answered 503 breaker-open, 1 to 100000. Default 1024.
                      type: integer
                      minimum: 1
                      maximum: 100000
                    maxConnections:
                      description: HTTP/1 connections per pod pool, 1 to 100000. Default 1024.
                      type: integer
                      minimum: 1
                      maximum: 100000
                faults:
                  description: >-
                    Faults injected by the sidecar of every caller into its mesh-routed requests to the Service
                    (spec §7.9 "Fault injection"), at most 16, the first whose match holds applies. Service
                    targets only.
                  type: array
                  maxItems: 16
                  items:
                    type: object
                    properties:
                      match:
                        description: One Gateway API HTTPRouteMatch; absent matches every request.
                        type: object
                        properties:
                          path:
                            type: object
                            properties:
                              type:
                                type: string
                                enum: [Exact, PathPrefix]
                                default: PathPrefix
                              value:
                                type: string
                                default: /
                                minLength: 1
                                maxLength: 1024
                                pattern: ^/
                          method:
                            type: string
                            enum: [GET, HEAD, POST, PUT, DELETE, CONNECT, OPTIONS, TRACE, PATCH]
                          headers:
                            type: array
                            maxItems: 16
                            items:
                              type: object
                              required: [name, value]
                              properties:
                                type:
                                  type: string
                                  enum: [Exact]
                                  default: Exact
                                name:
                                  type: string
                                  minLength: 1
                                  maxLength: 256
                                  pattern: ^[A-Za-z0-9!#$%&'*+\-.^_`|~]+$
                                value:
                                  type: string
                                  minLength: 1
                                  maxLength: 4096
                          queryParams:
                            type: array
                            maxItems: 16
                            items:
                              type: object
                              required: [name, value]
                              properties:
                                type:
                                  type: string
                                  enum: [Exact]
                                  default: Exact
                                name:
                                  type: string
                                  minLength: 1
                                  maxLength: 256
                                value:
                                  type: string
                                  minLength: 1
                                  maxLength: 1024
                      delay:
                        description: A fixed delay applied to the share of requests drawn by percent.
                        type: object
                        required: [percent, fixed]
                        properties:
                          percent:
                            description: Share of the matching requests delayed, an integer 0 to 100.
                            type: integer
                            minimum: 0
                            maximum: 100
                          fixed:
                            description: A Gateway API duration, 1ms to 60s.
                            type: string
                            maxLength: 28
                            pattern: ^([0-9]{1,5}(h|m|s|ms)){1,4}$
                            x-kubernetes-validations:
                              - rule: "duration(self) >= duration('1ms') && duration(self) <= duration('60s')"
                                message: "faults[].delay.fixed is 1ms to 60s"
                      abort:
                        description: A status answered, without reaching a pod, to the share of requests drawn by percent. An abort drawn wins over a delay drawn.
                        type: object
                        required: [percent, status]
                        properties:
                          percent:
                            description: Share of the matching requests aborted, an integer 0 to 100.
                            type: integer
                            minimum: 0
                            maximum: 100
                          status:
                            description: The HTTP status answered, 200 to 599.
                            type: integer
                            minimum: 200
                            maximum: 599
                    x-kubernetes-validations:
                      - rule: "has(self.delay) || has(self.abort)"
                        message: "faults[] needs a delay or an abort"
                admission:
                  description: >-
                    Admission contract of each pod of the Deployment (spec §4.1 "Admission contract"): at most
                    `concurrency` requests in flight and `rps` per second, a queue of a tenth of `concurrency` for
                    150 ms, the rest answered 503. Absent: no admission control. Deployment targets only.
                  type: object
                  required: [concurrency, rps]
                  properties:
                    concurrency:
                      description: Requests in flight per pod, 1 to 100000.
                      type: integer
                      minimum: 1
                      maximum: 100000
                    rps:
                      description: Requests per second per pod, 1 to 1000000.
                      type: integer
                      minimum: 1
                      maximum: 1000000
              x-kubernetes-validations:
                - rule: "!has(self.destinations) || self.targetRefs.exists(t, t.kind == 'Deployment')"
                  message: "destinations fit a Deployment target only"
                - rule: "!has(self.mesh) || self.targetRefs.exists(t, t.kind == 'Deployment')"
                  message: "mesh fits a Deployment target only"
                - rule: "!has(self.loadBalancer) || self.targetRefs.exists(t, t.kind == 'Service')"
                  message: "loadBalancer fits a Service target only"
                - rule: "!has(self.retries) || self.targetRefs.exists(t, t.kind == 'Service')"
                  message: "retries fit a Service target only"
                - rule: "!has(self.retryBudget) || self.targetRefs.exists(t, t.kind == 'Service')"
                  message: "retryBudget fits a Service target only"
                - rule: "!has(self.outlierDetection) || self.targetRefs.exists(t, t.kind == 'Service')"
                  message: "outlierDetection fits a Service target only"
                - rule: "!has(self.circuitBreaker) || self.targetRefs.exists(t, t.kind == 'Service')"
                  message: "circuitBreaker fits a Service target only"
                - rule: "!has(self.faults) || self.targetRefs.exists(t, t.kind == 'Service')"
                  message: "faults fit a Service target only"
                - rule: "!has(self.admission) || self.targetRefs.exists(t, t.kind == 'Deployment')"
                  message: "admission fits a Deployment target only"
