# MimicConfig (spec §7, §7.9, M1): settings of the mesh for the Deployments and Services of its own
# namespace, attached by `targetRefs` (design §6). The controller writes `status` through the status
# subresource only. The CRD has no controller yet at M1: the view builder is pure code (#440).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: mimicconfigs.mimic.platform.io
  labels:
    {{- include "mimic.labels" . | nindent 4 }}
  annotations:
    # Kept on uninstall with the other CRDs: removing the objects is explicit (spec §7.1).
    helm.sh/resource-policy: keep
spec:
  group: mimic.platform.io
  scope: Namespaced
  names:
    kind: MimicConfig
    listKind: MimicConfigList
    plural: mimicconfigs
    singular: mimicconfig
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Accepted
          type: string
          jsonPath: .status.conditions[?(@.type=="Accepted")].status
        - name: Resolved
          type: string
          jsonPath: .status.conditions[?(@.type=="ResolvedRefs")].status
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            status:
              type: object
              properties:
                conditions:
                  type: array
                  maxItems: 8
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type:
                        type: string
                        enum: [Accepted, ResolvedRefs]
                      status:
                        type: string
                        enum: ["True", "False", Unknown]
                      reason:
                        description: "Accepted: Accepted, Conflicted, TargetNotFound, Invalid. ResolvedRefs: ResolvedRefs, RefNotPermitted."
                        type: string
                        maxLength: 64
                      message:
                        type: string
                        maxLength: 1024
                      observedGeneration: {type: integer, format: int64}
                      lastTransitionTime: {type: string, format: date-time}
            spec:
              type: object
              required: [targetRefs]
              properties:
                targetRefs:
                  description: >-
                    The Deployments and Services this object configures, in the namespace of the object (a
                    reference never leaves it). When several MimicConfigs target the same object the oldest wins
                    as a whole (spec §7).
                  type: array
                  minItems: 1
                  maxItems: 16
                  items:
                    type: object
                    required: [group, kind, name]
                    properties:
                      group:
                        type: string
                        enum: ["apps", ""]
                      kind:
                        type: string
                        enum: [Deployment, Service]
                      name:
                        type: string
                        minLength: 1
                        maxLength: 253
                      # Declared only so that CEL can see it and refuse it.
                      namespace:
                        type: string
                    x-kubernetes-validations:
                      - rule: "!has(self.namespace)"
                        message: "targetRefs are in the namespace of the MimicConfig: namespace must not be set"
                      - rule: "(self.kind == 'Deployment' && self.group == 'apps') || (self.kind == 'Service' && self.group == '')"
                        message: "targetRefs must be apps/Deployment or core/Service"
                destinations:
                  description: >-
                    Services outside the namespace that the Deployment targets call (at most 256). One is resolved
                    only when its namespace holds a ReferenceGrant from MimicConfig of this namespace to Service
                    (spec §7.9). Deployment targets only.
                  type: array
                  maxItems: 256
                  items:
                    type: object
                    required: [namespace, name]
                    properties:
                      namespace: {type: string, minLength: 1, maxLength: 63}
                      name: {type: string, minLength: 1, maxLength: 253}
                mesh:
                  description: Deployment targets only.
                  type: object
                  properties:
                    enabled:
                      description: "false: this workload's sidecar relays bytes and routes nothing (design §3.4)."
                      type: boolean
                      default: true
                loadBalancer:
                  description: Service targets only.
                  type: object
                  properties:
                    slowStart:
                      description: Slow start window of new endpoints, `<n>s`, 0s to 3600s; `0s` disables. Default 30s.
                      type: string
                      pattern: '^[0-9]{1,4}s$'
                  x-kubernetes-validations:
                    - rule: "!has(self.slowStart) || int(self.slowStart.replace('s', '')) <= 3600"
                      message: "loadBalancer.slowStart is at most 3600s"
              x-kubernetes-validations:
                - rule: "!has(self.destinations) || self.targetRefs.exists(t, t.kind == 'Deployment')"
                  message: "destinations fit a Deployment target only"
                - rule: "!has(self.mesh) || self.targetRefs.exists(t, t.kind == 'Deployment')"
                  message: "mesh fits a Deployment target only"
                - rule: "!has(self.loadBalancer) || self.targetRefs.exists(t, t.kind == 'Service')"
                  message: "loadBalancer fits a Service target only"
