{{- if .Values.monitoring.grafana.enabled }}
{{- $name := include "mimic.grafanaAdminSecret" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
# The Grafana admin password (spec §10.7, MON-19, #379): 32 alphanumeric characters, drawn once and kept across upgrades
# (lookup), mounted as a file in the grafana container only. Never in values, args, env or logs.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "mimic.labels" . | nindent 4 }}
  annotations:
    # Never deleted by helm, so the admin password survives a reinstall of the release.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $existing $existing.data (index $existing.data "admin-password") }}
  admin-password: {{ index $existing.data "admin-password" }}
  {{- else }}
  admin-password: {{ randAlphaNum 32 | b64enc }}
  {{- end }}
{{- end }}
