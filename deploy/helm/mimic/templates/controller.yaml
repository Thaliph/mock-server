apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-controller
  labels:
    {{- include "mimic.labels" . | nindent 4 }}
# The controller talks to the API server (MimicWorkload cache, webhook Secret and caBundle).
automountServiceAccountToken: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-controller
  labels:
    {{- include "mimic.labels" . | nindent 4 }}
    app.kubernetes.io/name: mimic-controller
spec:
  replicas: {{ .Values.controller.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: mimic-controller
  template:
    metadata:
      labels:
        {{- include "mimic.labels" . | nindent 8 }}
        app.kubernetes.io/name: mimic-controller
    spec:
      serviceAccountName: {{ .Release.Name }}-controller
      automountServiceAccountToken: true
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: {{ include "mimic.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/mimic-controller"]
          env:
            - name: MIMIC_LOG
              value: {{ .Values.controller.logLevel | quote }}
            - name: MIMIC_ADMIN_ADDR
              value: "0.0.0.0:8081"
            - name: MIMIC_VALKEY_URL
              value: "redis://{{ .Release.Name }}-valkey:6379"
            - name: MIMIC_VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "mimic.valkeySecret" . }}
                  key: password
            - name: MIMIC_NAMESPACE
              valueFrom:
                fieldRef: {fieldPath: metadata.namespace}
            - name: MIMIC_WEBHOOK_ADDR
              value: "0.0.0.0:8443"
            - name: MIMIC_WEBHOOK_SERVICE
              value: {{ include "mimic.controllerService" . | quote }}
            - name: MIMIC_WEBHOOK_SECRET
              value: {{ include "mimic.webhookSecret" . | quote }}
            - name: MIMIC_WEBHOOK_CONFIGURATION
              value: {{ include "mimic.webhookConfiguration" . | quote }}
            - name: MIMIC_WEBHOOK_MAX_CONNECTIONS
              value: {{ .Values.controller.webhook.maxConnections | quote }}
            - name: MIMIC_WEBHOOK_REQUEST_TIMEOUT
              value: {{ .Values.controller.webhook.requestTimeout | quote }}
            - name: MIMIC_INJECT_SIDECAR_IMAGE
              value: {{ include "mimic.image" . | quote }}
            - name: MIMIC_INJECT_INIT_IMAGE
              value: {{ include "mimic.initImage" . | quote }}
            - name: MIMIC_INJECT_SIDECAR_RESOURCES
              value: {{ toJson .Values.inject.sidecarResources | quote }}
            - name: MIMIC_INJECT_SIDECAR_LOG
              value: {{ .Values.inject.sidecarLogLevel | quote }}
          ports:
            - name: admin
              containerPort: 8081
            - name: webhook
              containerPort: 8443
          livenessProbe:
            httpGet: {path: /healthz, port: admin}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: admin}
            periodSeconds: 5
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          securityContext:
            {{- include "mimic.containerSecurity" . | nindent 12 }}
      {{- with .Values.controller.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        {{- if .Values.controller.affinity }}
        {{- toYaml .Values.controller.affinity | nindent 8 }}
        {{- else }}
        # Replicas on different nodes when the cluster allows it (preferred, so a single-node cluster still runs them).
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/instance: {{ .Release.Name }}
                    app.kubernetes.io/name: mimic-controller
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-controller
  labels:
    {{- include "mimic.labels" . | nindent 4 }}
    app.kubernetes.io/name: mimic-controller
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: mimic-controller
  ports:
    - name: admin
      port: 8081
      targetPort: admin
    # Admission webhook (spec §7.1); the MutatingWebhookConfiguration calls this port.
    - name: webhook
      port: 8443
      targetPort: webhook
