{{- if .Values.metrics.serviceMonitor.enabled }}
{{- $controller := include "mimic.scrapeTarget" (dict "root" . "job" (printf "%s-controller" .Release.Name)) | fromJson }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $controller.name }}
  labels:
    {{- include "mimic.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- toYaml $controller.matchLabels | nindent 6 }}
  endpoints:
    - port: {{ $controller.port }}
      path: /metrics
      interval: {{ $controller.interval }}
{{- end }}
