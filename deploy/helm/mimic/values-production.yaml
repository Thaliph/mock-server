# Production overlay of the mimic chart (spec §12.18, #438). Install with the defaults replaced by this file:
#   helm install mimic oci://ghcr.io/thaliph/charts/mimic --version <version> -n mimic-system --create-namespace \
#     -f values-production.yaml
# (from a checkout: helm install mimic deploy/helm/mimic -n mimic-system -f deploy/helm/mimic/values-production.yaml).
# Placeholders to fill in before the install are marked PLACEHOLDER. Nothing here is a secret: the Valkey password
# is generated by the chart, or read from a Secret named by valkey.existingSecret (see the wiki, Install.md).
# The release is called `mimic` in the wiki; the names of the objects follow the release name.

# Images by digest; the image tag is not used while a digest is set. In the repository these are the digests of a
# published release; the release workflow pins them to its own images (scripts/pin-chart.sh), so the overlay
# packaged in a chart version always matches that version.
image:
  digest: sha256:f64e80a46f47e0b6c45fc4655fd134386fbcf60cc414afb6ec10ff526043e880
inject:
  initImage:
    digest: sha256:6bf99c9e40abb1b0b6baf04557bc8b4c060e28e1035759bee879dbb1c3929754
  # Resources of the injected mimic-sidecar. CPU limits are ceilings that keep the sidecar from starving the
  # application; the memory limit is the one of the sidecar's own budget (MIMIC_MOCK_MAX_PENDING sizing).
  sidecarResources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: "1", memory: 128Mi}
  sidecarLogLevel: info

controller:
  # Three replicas over zones and nodes: the webhook fails closed, so the controller must survive a drain or a zone
  # loss. The PodDisruptionBudget (maxUnavailable 1, chart default) keeps two of them up during a drain.
  replicas: 3
  logLevel: info
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    # Memory sized for the pushes the body budget lets through at once (spec §7.3, SHR-18).
    limits: {cpu: "1", memory: 768Mi}
  # Spread the controller pods across zones and nodes. ScheduleAnyway, not DoNotSchedule: on a cluster with fewer zones
  # or nodes than replicas the pods still schedule, and the spread is a preference the scheduler honours when it can.
  # The selector is the controller's name label, which is the same for every release in a namespace.
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: mimic-controller
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: mimic-controller
  # PLACEHOLDER: a PriorityClass the cluster admin creates (the chart does not create one). A pod whose class is missing
  # stays Pending. Keep it below system-cluster-critical: the controller is important, not a node component.
  priorityClassName: mimic-critical

# Valkey: the store of every report. One replica (a StatefulSet), so no spread.
valkey:
  persistence:
    enabled: true
    # AOF rewrites need about twice the data (spec §7.3).
    size: 8Gi
    # PLACEHOLDER: a StorageClass of your cluster, ideally with reclaimPolicy Retain. Empty: the cluster default.
    storageClass: ""
  # maxmemory is 75 % of the memory limit; the memory request equals maxmemory (the chart's rule, spec §7.3).
  resources:
    requests: {cpu: 100m, memory: 1536Mi}
    limits: {cpu: "1", memory: 2Gi}
  priorityClassName: mimic-critical
  # The Redis exporter (spec §10.7): on for the production monitors. Enabling it restarts Valkey once at install.
  metrics:
    enabled: true
    resources:
      requests: {cpu: 10m, memory: 16Mi}
      limits: {cpu: 100m, memory: 32Mi}

networkPolicy:
  enabled: true
  # PLACEHOLDER: the source of the admission webhook calls, the API server. Replace the CIDR with the address range
  # the API server calls from (the control plane nodes on most clusters; check your provider). Until it is replaced,
  # the documentation range below admits no real source and pod creation in injected namespaces is refused (the
  # webhook fails closed): an unedited copy fails loudly instead of admitting every source.
  webhookFrom:
    - ipBlock:
        cidr: 192.0.2.0/24

# Monitors for an installed Prometheus Operator (the CRDs ServiceMonitor and PodMonitor must exist). The bundled
# Prometheus and Grafana stay off: a production cluster scrapes with its own stack.
metrics:
  serviceMonitor:
    enabled: true
    interval: 30s
  podMonitor:
    enabled: true
    interval: 30s

monitoring:
  dashboards:
    enabled: false
  prometheus:
    enabled: false
  grafana:
    enabled: false

# Load tests stay off: they add a CRD and admission policies that a production cluster does not need unless it runs them.
loadTest:
  enabled: false
