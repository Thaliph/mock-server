# Image holding mimic-controller and mimic-sidecar.
image:
  repository: ghcr.io/thaliph/mimic
  # Defaults to the chart appVersion.
  tag: ""
  # Takes precedence over tag when set (sha256:…).
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

controller:
  # Two replicas: the webhook fails closed, so one pod being down stalls pod creation in scope.
  replicas: 2
  logLevel: info
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    # Sized for the pushes the body budget lets through at once, each at the store limits, plus
    # headroom for the allocator (spec §7.3, SHR-18).
    limits: {memory: 768Mi}
  nodeSelector: {}
  tolerations: []
  # Empty: preferred pod anti-affinity on kubernetes.io/hostname (spread replicas across nodes).
  affinity: {}
  # Admission webhook limits (spec §10.2). Both must be set; invalid values exit the controller with 2.
  webhook:
    # Concurrent webhook connections served.
    maxConnections: 256
    # TLS handshake and per-request read deadline (`<n>s` or `<n>ms`, greater than 0).
    requestTimeout: 5s
  # Sidecar API port (spec §7.2): sidecars authenticate here with their projected token. Served
  # with the webhook certificate; the controller Service and NetworkPolicy expose it.
  sidecarApiPort: 8444
  # MimicWorkload status (spec §7.4).
  status:
    # Period of the status update (1s to 1h).
    interval: 30s
    # A pod counts in status.discovery.pods while its last push is this recent (1s to 24h).
    podWindow: 5m

# Pod injection (spec §7.1). The sidecar image is `image` above.
inject:
  # mimic-init, the init container that installs the traffic redirection in injected pods.
  initImage:
    repository: ghcr.io/thaliph/mimic-init
    # Defaults to the chart appVersion.
    tag: ""
    # Takes precedence over tag when set (sha256:…).
    digest: ""
  # Resources of mimic-sidecar in injected pods.
  sidecarResources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 128Mi}
  # MIMIC_LOG given to mimic-sidecar.
  sidecarLogLevel: info

valkey:
  image:
    repository: docker.io/valkey/valkey
    tag: 9.0-alpine
    digest: sha256:2d04268dfa26ab31cfa3fdc538866e76438b2d00e41db41b8cb86d780ac5a416
  # Secret holding the key `password`. Empty: the chart creates one with a random password,
  # kept across upgrades and on uninstall.
  existingSecret: ""
  # AOF on a PVC (spec §7.3). false: an emptyDir, so the store is lost when the pod restarts.
  persistence:
    enabled: true
    # AOF rewrites need about twice the data.
    size: 4Gi
    storageClass: ""
  # Valkey runs with maxmemory at 75 % of limits.memory and maxmemory-policy noeviction (spec §7.3):
  # a full store answers writes with an error instead of evicting part of a deployment.
  # The memory request equals maxmemory (75 % of the limit): the scheduler reserves what a full
  # store uses, and Valkey is not the first pod evicted under node memory pressure. The rest of
  # the limit is the headroom of AOF rewrites.
  resources:
    requests: {cpu: 50m, memory: 768Mi}
    limits: {memory: 1Gi}
  nodeSelector: {}
  tolerations: []
  # The Redis exporter as a container of the Valkey pod (spec §10.7, #378). It reaches Valkey on
  # localhost as the ACL user mimic-exporter (+info +ping, no key access). Off by default; enabling
  # restarts Valkey once.
  metrics:
    enabled: false
    image:
      repository: docker.io/oliver006/redis_exporter
      tag: v1.95.0
      # Pinned in images/Dockerfile (stage redis-exporter); scripts/check-pins.sh keeps the two equal.
      digest: sha256:afb21407aba3df1b4010899f155fc6b1ba2026c97b725d72aca4019d772e7b6b
    resources:
      requests: {cpu: 10m, memory: 16Mi}
      limits: {memory: 32Mi}

# NetworkPolicies of Valkey (ingress from the controller only) and of the controller.
networkPolicy:
  enabled: true
  # Sources of the webhook port (8443), as NetworkPolicy `from` peers. Empty: any source, since the
  # API server's source address depends on the cluster. Set it to narrow the webhook port.
  webhookFrom: []
  # Namespace selector of the namespaces that may scrape the admin port (8081), e.g.
  # {kubernetes.io/metadata.name: monitoring}. Empty: the release namespace only.
  metricsNamespaceSelector: {}
  # Sources of the sidecar API port (controller.sidecarApiPort), as NetworkPolicy `from` peers.
  # Empty: any source, since injected pods can be in any namespace. Set it to narrow the port.
  sidecarApiFrom: []
  # The API server's address as an ipBlock CIDR, for the egress of the bundled Prometheus and Grafana to TCP 443
  # and 6443 (spec §10.7, #379). Empty: any destination on those ports, since the address depends on the cluster.
  apiServerCIDR: ""

# Load tests of a deployment in mock mode (spec §7.8, F11). Off by default: it adds the
# MimicLoadTest CRD, Job and EndpointSlice RBAC and two ValidatingAdmissionPolicies. Needs image.digest:
# the policies pin the mimic image by digest.
loadTest:
  enabled: false
  # NetworkPolicy of each generator pod (spec §7.8): egress only to the deployment, the controller and DNS.
  # A CNI without NetworkPolicy support ignores it (spec §11.1).
  networkPolicy: true
  # NetworkPolicy peers allowed to scrape the generator's admin port (15100). Empty: none, unless
  # metrics.podMonitor.enabled or monitoring.prometheus.enabled, which admit the namespace peer of
  # networkPolicy.metricsNamespaceSelector (the release namespace when that is empty). A set value wins (spec §10.7).
  metricsFrom: []
  # DNS of the generator's controller name lookups: the namespace and the labels of the DNS pods.
  dnsSelector:
    namespace: kube-system
    podLabels: {k8s-app: kube-dns}

metrics:
  # Prometheus Operator ServiceMonitor for the controller.
  serviceMonitor:
    enabled: false
    interval: 30s
  # Prometheus Operator PodMonitor (monitoring.coreos.com/v1, needs its CRDs at install). Off by
  # default. The bundled Prometheus does not read it.
  podMonitor:
    enabled: false
    interval: 30s
    # Namespaces the PodMonitors select pods in. any: true: a pod can be injected through a
    # MimicWorkload alone.
    namespaceSelector:
      any: true

# The bundled Prometheus and Grafana (spec §10.7, #379): for a demo or a dev cluster only, off by default.
monitoring:
  prometheus:
    enabled: false
    # Namespaces of the sidecar and load jobs, besides the release namespace. Empty: every namespace, through
    # a ClusterRole. A list: a Role in each of them and in the release namespace.
    namespaces: []
    image:
      repository: quay.io/prometheus/prometheus
      tag: v3.15.1
      # Pinned in images/Dockerfile (stage prometheus); scripts/check-pins.sh keeps the two equal.
      digest: sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    # --storage.tsdb.retention.time, and --storage.tsdb.retention.size below the emptyDir limit, so that the kubelet
    # never evicts the pod for its data.
    retention: 24h
    retentionSize: 800MB
    # sizeLimit of the emptyDir that holds the TSDB. No persistent volume: the data are lost on a pod restart.
    storageSizeLimit: 1Gi
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {memory: 512Mi}
  # Grafana (spec §10.7, #379): the dashboards of the mimic dashboard ConfigMaps (#380 to #384) are read from the
  # ConfigMaps labelled grafana_dashboard: "1" in the release namespace. Off by default.
  grafana:
    enabled: false
    image:
      repository: docker.io/grafana/grafana
      tag: 13.2.4-distroless
      # Pinned in images/Dockerfile (stage grafana); scripts/check-pins.sh keeps the two equal.
      digest: sha256:ae3d3add290adbe6a88412229f5d76fd7bb82743050881698642d3d62f277e35
    # The dashboard sidecar: it writes the dashboard files and never calls Grafana (no credential).
    sidecarImage:
      repository: quay.io/kiwigrid/k8s-sidecar
      tag: 2.14.1
      # Pinned in images/Dockerfile (stage k8s-sidecar).
      digest: sha256:092dbe0c335fba9af414a27630ca68f34df6185784fa847d9954187e69dbfdd7
    # URL of the provisioned Prometheus datasource. Empty: the bundled Prometheus, http://<release>-prometheus:9090.
    datasourceUrl: ""
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {memory: 256Mi}
    sidecarResources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {memory: 64Mi}
