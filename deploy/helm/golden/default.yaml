# Source: mimic/templates/controller-networkpolicy.yaml
# Ingress to the controller (spec §11). The webhook port is open to any source by default, since the
# API server's source address depends on the cluster (networkPolicy.webhookFrom narrows it); the
# sidecar API port likewise (networkPolicy.sidecarApiFrom). The admin port serves health,
# readiness and metrics: the release namespace and the namespaces in
# networkPolicy.metricsNamespaceSelector only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mimic-controller
  labels:
    app.kubernetes.io/part-of: mimic
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: mimic
    app.kubernetes.io/version: "0.2.0-alpha.1"
    helm.sh/chart: mimic-0.2.0-alpha.1
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: mimic
      app.kubernetes.io/name: mimic-controller
  policyTypes: [Ingress]
  ingress:
    -
      ports:
        - {port: 8443, protocol: TCP}
    # Sidecar API (spec §7.2, §11): injected pods, in any namespace unless sidecarApiFrom narrows it.
    -
      ports:
        - {port: 8444, protocol: TCP}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mimic-system
      ports:
        - {port: 8081, protocol: TCP}

