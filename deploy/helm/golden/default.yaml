# Source: mimic/templates/crd.yaml
# MimicWorkload (spec §7, §7.1): spec.deployment, spec.mode, (F10) spec.mock, (F3) spec.tls.exclude and (F4) spec.discovery.redact, (F5) status.discovery.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: mimicworkloads.mimic.platform.io
  labels:
    app.kubernetes.io/part-of: mimic
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: mimic
    app.kubernetes.io/version: "0.2.0-alpha.1"
    helm.sh/chart: mimic-0.2.0-alpha.1
  annotations:
    # `helm uninstall` leaves the CRD and every MimicWorkload (spec §7.1); removing them is explicit.
    helm.sh/resource-policy: keep
spec:
  group: mimic.platform.io
  scope: Namespaced
  names:
    kind: MimicWorkload
    listKind: MimicWorkloadList
    plural: mimicworkloads
    singular: mimicworkload
  versions:
    - name: v1alpha1
      served: true
      storage: true
      # Written by the controller only, through the status subresource (spec §7.4).
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Mode
          type: string
          jsonPath: .spec.mode
        # Inbound + outbound endpoints; 0 until a controller of F8 or later applies a status (spec §7.4).
        - name: Endpoints
          type: integer
          jsonPath: .status.discovery.totalEndpoints
        - name: Pods
          type: integer
          jsonPath: .status.discovery.pods
        - name: Last push
          type: date
          jsonPath: .status.discovery.lastPushTime
        # Pods whose last egress answer carried the effective mode (spec §7.4).
        - name: Mode pods
          type: integer
          jsonPath: .status.mode.pods
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            status:
              type: object
              properties:
                mode:
                  description: How many pods follow the effective mode of the Deployment (spec §7.4).
                  type: object
                  properties:
                    mode:
                      description: Effective mode of the Deployment.
                      type: string
                      enum: [discovery, mock]
                    # Defaulted, so the Mode pods column reads 0 instead of nothing (spec §7.4).
                    pods:
                      description: Pods whose last egress answer is within MIMIC_STATUS_POD_WINDOW and carried `mode`.
                      type: integer
                      format: int64
                      default: 0
                    otherPods:
                      description: Pods within the window whose last answer carried the other mode.
                      type: integer
                      format: int64
                      default: 0
                discovery:
                  description: What the controller holds of the Deployment's discovery data (spec §7.4).
                  type: object
                  properties:
                    endpoints:
                      description: Endpoints per direction; a direction without any is omitted.
                      type: object
                      properties:
                        # Defaulted (spec §7.4).
                        inbound: {type: integer, format: int64, default: 0}
                        outbound: {type: integer, format: int64}
                    # Defaulted, so the Endpoints column reads 0 instead of nothing (spec §7.4).
                    totalEndpoints: {type: integer, format: int64, default: 0}
                    exchanges:
                      description: Exchanges currently held, both directions. Not a running total.
                      type: integer
                      format: int64
                    sampleBytes: {type: integer, format: int64}
                    pods:
                      description: Pods whose last push is within MIMIC_STATUS_POD_WINDOW.
                      type: integer
                      format: int64
                    lastPushTime:
                      description: Last applied push, UTC, in seconds. Absent without data.
                      type: string
                      format: date-time
            spec:
              type: object
              required: [deployment]
              properties:
                deployment:
                  description: Name of the Deployment, in the same namespace, that this MimicWorkload selects. Immutable.
                  type: string
                  maxLength: 253
                  # DNS-1123 subdomain, the rule Kubernetes applies to Deployment names.
                  pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'
                  x-kubernetes-validations:
                    - rule: "self == oldSelf"
                      message: "spec.deployment is immutable"
                mode:
                  description: Mimic mode of the Deployment's pods.
                  type: string
                  enum: [discovery, mock]
                  default: discovery
                tls:
                  description: TLS interception settings of the Deployment's pods (spec §5). Applied to pods created afterwards.
                  type: object
                  properties:
                    exclude:
                      description: >-
                        Names whose TLS connections are never intercepted: an exact host, a suffix pattern
                        `*.example.com` (below `example.com`, not itself) or an IP literal.
                      type: array
                      maxItems: 256
                      items:
                        type: string
                        maxLength: 253
                        # A DNS name (labels of letters, digits, `-`, `_`), optionally `*.` first, or an IPv6 literal.
                        pattern: '^((\*\.)?[A-Za-z0-9_]([-A-Za-z0-9_]{0,61}[A-Za-z0-9_])?(\.[A-Za-z0-9_]([-A-Za-z0-9_]{0,61}[A-Za-z0-9_])?)*\.?|[0-9A-Fa-f.]*:[0-9A-Fa-f:.]+)$'
                mock:
                  description: >-
                    Mock mode settings of the Deployment's pods (spec §7, §8). `spec.mode: mock` turns them on;
                    the effective mode of a Deployment is `mock` as soon as one of its MimicWorkloads says so.
                  type: object
                  properties:
                    latencyFactor:
                      description: Multiplies the latency drawn from the recorded histogram of an endpoint; 0 answers at once. Rounded to the nearest hundredth.
                      type: number
                      minimum: 0
                      maximum: 100
                      default: 1
                    passthrough:
                      description: >-
                        Destinations a mocked pod still reaches for real: an exact host, a suffix pattern
                        `*.example.com` or an IP literal (the `spec.tls.exclude` grammar). Applied to pods created afterwards.
                      type: array
                      maxItems: 256
                      items:
                        type: string
                        maxLength: 253
                        pattern: '^((\*\.)?[A-Za-z0-9_]([-A-Za-z0-9_]{0,61}[A-Za-z0-9_])?(\.[A-Za-z0-9_]([-A-Za-z0-9_]{0,61}[A-Za-z0-9_])?)*\.?|[0-9A-Fa-f.]*:[0-9A-Fa-f:.]+)$'
                discovery:
                  description: Endpoint discovery settings of the Deployment's pods (spec §6). Applied to pods created afterwards.
                  type: object
                  properties:
                    redact:
                      description: >-
                        Extra names redacted by name in discovered headers, query keys, form fields and JSON keys,
                        on top of the built-in ones. Compared like the built-in names (case ignored, matched on token boundaries: `-`, `_`, `.` and case changes). Lower-cased by the webhook.
                      type: array
                      maxItems: 64
                      items:
                        type: string
                        minLength: 1
                        maxLength: 64
                        pattern: '^[A-Za-z0-9_-]+$'

