# Source: mimic/templates/controller.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mimic-controller
  labels:
    app.kubernetes.io/part-of: mimic
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: mimic
    app.kubernetes.io/version: "0.2.0-alpha.1"
    helm.sh/chart: mimic-0.2.0-alpha.1
    app.kubernetes.io/name: mimic-controller
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/instance: mimic
      app.kubernetes.io/name: mimic-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: mimic
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/instance: mimic
        app.kubernetes.io/version: "0.2.0-alpha.1"
        helm.sh/chart: mimic-0.2.0-alpha.1
        app.kubernetes.io/name: mimic-controller
    spec:
      serviceAccountName: mimic-controller
      automountServiceAccountToken: true
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: ghcr.io/thaliph/mimic:0.2.0-alpha.1
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/mimic-controller"]
          env:
            # Bounds the allocator's arenas: the controller holds reports of tens of megabytes
            # (spec §7.3, SHR-18). It applies to glibc, which the image has: the controller is built
            # on Debian and runs on distroless cc-debian13, with the default allocator.
            - name: MALLOC_ARENA_MAX
              value: "2"
            - name: MIMIC_LOG
              value: "info"
            - name: MIMIC_ADMIN_ADDR
              value: "0.0.0.0:8081"
            - name: MIMIC_VALKEY_URL
              value: "redis://mimic-valkey:6379"
            - name: MIMIC_VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: golden
                  key: password
            - name: MIMIC_NAMESPACE
              valueFrom:
                fieldRef: {fieldPath: metadata.namespace}
            - name: MIMIC_WEBHOOK_ADDR
              value: "0.0.0.0:8443"
            - name: MIMIC_SIDECAR_API_ADDR
              value: "0.0.0.0:8444"
            - name: MIMIC_WEBHOOK_SERVICE
              value: "mimic-controller"
            - name: MIMIC_WEBHOOK_SECRET
              value: "mimic-webhook-tls"
            - name: MIMIC_TLS_CA_SECRET
              value: "mimic-tls-ca"
            - name: MIMIC_WEBHOOK_CONFIGURATION
              value: "mimic-injector"
            - name: MIMIC_WEBHOOK_MAX_CONNECTIONS
              value: "256"
            - name: MIMIC_WEBHOOK_REQUEST_TIMEOUT
              value: "5s"
            - name: MIMIC_STATUS_INTERVAL
              value: "30s"
            - name: MIMIC_STATUS_POD_WINDOW
              value: "5m"
            # Load test runs active at once in the cluster (spec §10.2): 0 disables load tests.
            - name: MIMIC_LOAD_MAX_RUNS
              value: "0"
            - name: MIMIC_INJECT_SIDECAR_IMAGE
              value: "ghcr.io/thaliph/mimic:0.2.0-alpha.1"
            - name: MIMIC_INJECT_INIT_IMAGE
              value: "ghcr.io/thaliph/mimic-init:0.2.0-alpha.1"
            - name: MIMIC_INJECT_SIDECAR_RESOURCES
              value: "{\"limits\":{\"memory\":\"128Mi\"},\"requests\":{\"cpu\":\"50m\",\"memory\":\"64Mi\"}}"
            - name: MIMIC_INJECT_SIDECAR_LOG
              value: "info"
          ports:
            - name: admin
              containerPort: 8081
            - name: webhook
              containerPort: 8443
            - name: sidecar-api
              containerPort: 8444
          livenessProbe:
            httpGet: {path: /healthz, port: admin}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: admin}
            periodSeconds: 5
          resources:
            limits:
              memory: 768Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
      affinity:
        # Replicas on different nodes when the cluster allows it (preferred, so a single-node cluster still runs them).
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/instance: mimic
                    app.kubernetes.io/name: mimic-controller

