apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mimic-injector
  labels:
    app.kubernetes.io/part-of: mimic
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: mimic
    app.kubernetes.io/version: "0.2.0-alpha.1"
    helm.sh/chart: mimic-0.2.0-alpha.1
# caBundle is owned by the controller: it is not set here, so `helm upgrade` leaves it alone.
webhooks:
  # Namespace labelled enabled: every pod is injected unless it is labelled disabled.
  - name: namespace.inject.mimic.platform.io
    clientConfig:
      service:
        name: mimic-controller
        namespace: mimic-system
        port: 8443
        path: /inject/namespace
    rules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
        scope: Namespaced
    namespaceSelector:
      matchExpressions:
        - key: mimic.platform.io/inject
          operator: In
          values: [enabled]
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: ["kube-system","kube-public","kube-node-lease","mimic-system"]
    failurePolicy: Fail
    sideEffects: None
    reinvocationPolicy: IfNeeded
    timeoutSeconds: 5
    admissionReviewVersions: [v1]
  # Namespace labelled selected: only pods of a deployment named by a MimicWorkload.
  - name: workload.inject.mimic.platform.io
    clientConfig:
      service:
        name: mimic-controller
        namespace: mimic-system
        port: 8443
        path: /inject/workload
    rules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
        scope: Namespaced
    namespaceSelector:
      matchExpressions:
        - key: mimic.platform.io/inject
          operator: In
          values: [selected]
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: ["kube-system","kube-public","kube-node-lease","mimic-system"]
    failurePolicy: Fail
    sideEffects: None
    reinvocationPolicy: IfNeeded
    timeoutSeconds: 5
    admissionReviewVersions: [v1]
  # Pod labelled enabled, in any namespace: injected even when the namespace is not labelled.
  - name: pod.inject.mimic.platform.io
    clientConfig:
      service:
        name: mimic-controller
        namespace: mimic-system
        port: 8443
        path: /inject/pod
    rules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
        scope: Namespaced
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: ["kube-system","kube-public","kube-node-lease","mimic-system"]
    objectSelector:
      matchLabels:
        mimic.platform.io/inject: enabled
    failurePolicy: Fail
    sideEffects: None
    reinvocationPolicy: IfNeeded
    timeoutSeconds: 5
    admissionReviewVersions: [v1]

