# Source: mimic/templates/valkey.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mimic-valkey
  labels:
    app.kubernetes.io/part-of: mimic
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: mimic
    app.kubernetes.io/version: "0.2.0-alpha.1"
    helm.sh/chart: mimic-0.2.0-alpha.1
    app.kubernetes.io/name: mimic-valkey
spec:
  serviceName: mimic-valkey
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: mimic
      app.kubernetes.io/name: mimic-valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: mimic
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/instance: mimic
        app.kubernetes.io/version: "0.2.0-alpha.1"
        helm.sh/chart: mimic-0.2.0-alpha.1
        app.kubernetes.io/name: mimic-valkey
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          image: docker.io/valkey/valkey:9.0-alpine@sha256:2d04268dfa26ab31cfa3fdc538866e76438b2d00e41db41b8cb86d780ac5a416
          imagePullPolicy: IfNotPresent
          command: ["valkey-server"]
          # $(VALKEY_PASSWORD) is expanded by the kubelet; it never appears in the pod spec.
          # maxmemory is 75 % of the memory limit; noeviction makes a full store refuse writes (spec §7.3).
          args:
            - --dir
            - /data
            - --appendonly
            - "yes"
            - --requirepass
            - $(VALKEY_PASSWORD)
            - --maxmemory
            - "805306368"
            - --maxmemory-policy
            - noeviction
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: golden
                  key: password
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: golden
                  key: password
          ports:
            - name: valkey
              containerPort: 6379
          livenessProbe:
            tcpSocket: {port: valkey}
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            periodSeconds: 5
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 50m
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 4Gi

