# Source: mimic/templates/webhook.yaml
# Only the controller's service account is restricted, and only in its own configuration.
# Everything but clientConfig.caBundle (and the labels and annotations) must stay as it is.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: mimic-injector-cabundle-only
  labels:
    app.kubernetes.io/part-of: mimic
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: mimic
    app.kubernetes.io/version: "0.2.0-alpha.1"
    helm.sh/chart: mimic-0.2.0-alpha.1
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [admissionregistration.k8s.io]
        apiVersions: [v1]
        operations: [UPDATE]
        resources: [mutatingwebhookconfigurations]
        resourceNames: [mimic-injector]
  matchConditions:
    - name: controller-service-account
      expression: 'request.userInfo.username == "system:serviceaccount:mimic-system:mimic-controller"'
  variables:
    # Every field of each webhook except clientConfig.caBundle, projected into a map.
    - name: webhooks
      expression: |
        object.webhooks.map(w, {
          "name": dyn(w.name),
          "service": dyn(has(w.clientConfig.service) ? w.clientConfig.service : null),
          "url": dyn(has(w.clientConfig.url) ? w.clientConfig.url : null),
          "rules": dyn(has(w.rules) ? w.rules : null),
          "namespaceSelector": dyn(has(w.namespaceSelector) ? w.namespaceSelector : null),
          "objectSelector": dyn(has(w.objectSelector) ? w.objectSelector : null),
          "failurePolicy": dyn(has(w.failurePolicy) ? w.failurePolicy : null),
          "sideEffects": dyn(has(w.sideEffects) ? w.sideEffects : null),
          "reinvocationPolicy": dyn(has(w.reinvocationPolicy) ? w.reinvocationPolicy : null),
          "timeoutSeconds": dyn(has(w.timeoutSeconds) ? w.timeoutSeconds : null),
          "admissionReviewVersions": dyn(has(w.admissionReviewVersions) ? w.admissionReviewVersions : null),
          "matchPolicy": dyn(has(w.matchPolicy) ? w.matchPolicy : null)
        })
    - name: oldWebhooks
      expression: |
        oldObject.webhooks.map(w, {
          "name": dyn(w.name),
          "service": dyn(has(w.clientConfig.service) ? w.clientConfig.service : null),
          "url": dyn(has(w.clientConfig.url) ? w.clientConfig.url : null),
          "rules": dyn(has(w.rules) ? w.rules : null),
          "namespaceSelector": dyn(has(w.namespaceSelector) ? w.namespaceSelector : null),
          "objectSelector": dyn(has(w.objectSelector) ? w.objectSelector : null),
          "failurePolicy": dyn(has(w.failurePolicy) ? w.failurePolicy : null),
          "sideEffects": dyn(has(w.sideEffects) ? w.sideEffects : null),
          "reinvocationPolicy": dyn(has(w.reinvocationPolicy) ? w.reinvocationPolicy : null),
          "timeoutSeconds": dyn(has(w.timeoutSeconds) ? w.timeoutSeconds : null),
          "admissionReviewVersions": dyn(has(w.admissionReviewVersions) ? w.admissionReviewVersions : null),
          "matchPolicy": dyn(has(w.matchPolicy) ? w.matchPolicy : null)
        })
  validations:
    - expression: "variables.webhooks == variables.oldWebhooks"
      message: "the controller may only change clientConfig.caBundle of its webhook configuration"
    - expression: "(has(object.metadata.labels) ? object.metadata.labels : {}) == (has(oldObject.metadata.labels) ? oldObject.metadata.labels : {})"
      message: "the controller may not change the labels of its webhook configuration"
    - expression: "(has(object.metadata.annotations) ? object.metadata.annotations : {}) == (has(oldObject.metadata.annotations) ? oldObject.metadata.annotations : {})"
      message: "the controller may not change the annotations of its webhook configuration"

