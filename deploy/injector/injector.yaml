# Webhook d'injection (spec §9.4) : ajoute mimic-init et le sidecar mimic aux pods des
# namespaces labellisés mimic.platform.io/enabled=true. À appliquer après controller/.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mimic-injector
  namespace: mimic-system
# Le webhook n'appelle pas l'API Kubernetes.
automountServiceAccountToken: false
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mimic-injector-tls
  namespace: mimic-system
spec:
  secretName: mimic-injector-tls
  duration: 2160h
  renewBefore: 360h
  dnsNames:
    - mimic-injector.mimic-system.svc
    - mimic-injector.mimic-system.svc.cluster.local
  privateKey: {algorithm: ECDSA, size: 256}
  issuerRef: {name: mimic-ca, kind: Issuer}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mimic-injector
  namespace: mimic-system
data:
  injector.yaml: |
    listen: 0.0.0.0:8443
    # Relus toutes les 10 s : le certificat renouvelé par cert-manager sert sans redémarrage.
    tls: {cert_file: /etc/mimic/tls/tls.crt, key_file: /etc/mimic/tls/tls.key}
    image: ghcr.io/thaliph/mimic:0.1.0
    # L'IP du Service kubernetes (KUBERNETES_SERVICE_HOST du webhook) est toujours exclue :
    # l'API Kubernetes n'est jamais redirigée vers le sidecar. Autres destinations à exclure
    # de tous les pods, par exemple un endpoint privé de l'API (EKS) ou une base :
    #   exclude_outbound_cidrs: [10.96.0.1/32, 10.20.0.0/16]
    exclude_outbound_cidrs: []
    # Cluster double pile : règles ip6tables aussi (MIMIC_IPV6=true dans mimic-init).
    ipv6: false
    # mimic-init : quelques commandes iptables.
    init_resources:
      requests: {cpu: 10m, memory: 16Mi}
      limits: {memory: 64Mi}
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {memory: 256Mi}
    # Label du pod repris en label `version` des métriques (sinon pod-template-hash).
    version_label: app.kubernetes.io/version
    # Filtre des logs des sidecars (MIMIC_LOG) ; un pod le remplace par l'annotation
    # mimic.platform.io/log. Absent : info.
    # sidecar_log: info
    # Configuration par défaut des sidecars (spec §9.1). Un pod peut monter la sienne
    # avec l'annotation mimic.platform.io/config: <configmap>.
    sidecar_config: |
      mode: record
      inbound:
        listen: 0.0.0.0:15106
      outbound:
        listen: 127.0.0.1:15101
        connect_timeout: 10        # secondes : connexion vers l'amont, puis 504 (spec §3.5)
      # Toutes adresses pour les sondes et /metrics ; le reste ne répond qu'à 127.0.0.1 (spec §9.2).
      admin:
        listen: 0.0.0.0:15100
      server:
        header_read_timeout: 60    # secondes : en-têtes HTTP/1, inactivité keep-alive comprise
        max_connections: 2048      # entrant et sortant ensemble ; au-delà, refusées
      capture:
        samples_per_operation: 20
        max_inflight_bytes: 67108864   # 64 MiB de bodies copiés en vol (spec §5.2)
      # Bodies que la redaction ne sait pas lire (XML, texte, gRPC, binaire, sans type) : non
      # capturés, donc non mockables, sauf pour ces hôtes et `inbound` (spec §7). Par pod :
      # annotation mimic.platform.io/capture-raw-bodies.
      # redact:
      #   raw_bodies: [api.partner.io, inbound]
      mock:
        strategy: best
        unmatched: error
        latency_factor: 1.0
        tcp: refuse          # refuse | relay : TCP sortant non HTTP en mock (spec §3.4)
      store:
        dir: /var/lib/mimic
      tls:
        ca_dir: /var/run/mimic/ca
      share:
        url: https://mimic-controller.mimic-system.svc:8443
        ca_file: /etc/mimic-ca/ca.crt
        token_file: /var/run/secrets/mimic/token
        interval: 10
        mode_poll: 2
        max_snapshot_bytes: 67108864   # 64 MiB : forme de mock téléchargée (spec §5.6)
        # L'application attend le premier état souhaité (spec §5.5.5) ; la startupProbe posée
        # par le webhook tolère timeout + 30 s.
        startup:
          timeout: 30          # secondes, au plus 300
          fallback: record     # record | passthrough | mock-local | fail : contrôleur injoignable
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mimic-injector
  namespace: mimic-system
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: mimic-injector}
  template:
    metadata:
      labels: {app.kubernetes.io/name: mimic-injector}
    spec:
      serviceAccountName: mimic-injector
      # Webhook en failurePolicy Ignore : s'il n'a plus de réplique, les pods sont créés sans
      # mimic. Priorité au-dessus des workloads, sans être critique pour le cluster
      # (PriorityClass de controller/namespace.yaml).
      priorityClassName: mimic-control-plane
      # Deux nœuds quand c'est possible : la perte d'un nœud ne coupe pas l'injection.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: {app.kubernetes.io/name: mimic-injector}
      # SIGTERM : admissions en cours terminées (10 s au plus), puis sortie.
      terminationGracePeriodSeconds: 15
      # UID 1338 comme le sidecar ; jamais 1337, l'UID d'istio-proxy, que le mesh ne
      # redirigerait pas.
      securityContext:
        runAsUser: 1338
        runAsGroup: 1338
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: injector
          image: ghcr.io/thaliph/mimic:0.1.0
          command: ["/usr/local/bin/mimic-injector"]
          args: ["--config", "/etc/mimic/injector.yaml"]
          ports:
            - {name: webhook, containerPort: 8443}
          readinessProbe:
            httpGet: {path: /healthz, port: webhook, scheme: HTTPS}
          livenessProbe:
            httpGet: {path: /healthz, port: webhook, scheme: HTTPS}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: config, mountPath: /etc/mimic/injector.yaml, subPath: injector.yaml}
            - {name: tls, mountPath: /etc/mimic/tls, readOnly: true}
      volumes:
        - name: config
          configMap: {name: mimic-injector}
        - name: tls
          secret: {secretName: mimic-injector-tls}
---
apiVersion: v1
kind: Service
metadata:
  name: mimic-injector
  namespace: mimic-system
spec:
  selector: {app.kubernetes.io/name: mimic-injector}
  ports:
    - {name: webhook, port: 443, targetPort: webhook}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mimic-injector
  namespace: mimic-system
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: mimic-injector}
---
# failurePolicy Ignore : webhook indisponible, le pod est créé sans mimic plutôt que bloqué.
# Le caBundle est posé par le cainjector de cert-manager.
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mimic-injector
  annotations:
    cert-manager.io/inject-ca-from: mimic-system/mimic-injector-tls
webhooks:
  - name: inject.mimic.platform.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Ignore
    timeoutSeconds: 5
    # Rappelé si un webhook de mesh (Istio, Linkerd) injecte après lui (spec §9.4).
    reinvocationPolicy: IfNeeded
    # Tous les pods du namespace, sauf ceux labellisés mimic.platform.io/inject=false.
    # Le plan de contrôle n'est jamais injecté, même labellisé par erreur, ni un namespace en
    # arrêt d'urgence (spec §5.5.1).
    namespaceSelector:
      matchLabels: {mimic.platform.io/enabled: "true"}
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, mimic-system]
        - key: mimic.platform.io/emergency-stop
          operator: NotIn
          values: ["true"]
    # Choisi par l'API server : un pod non concerné n'atteint jamais le webhook.
    objectSelector:
      matchExpressions:
        - key: mimic.platform.io/inject
          operator: NotIn
          values: ["false"]
    rules:
      - operations: ["CREATE"]
        apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
        scope: Namespaced
    clientConfig:
      service:
        name: mimic-injector
        namespace: mimic-system
        path: /mutate
        port: 443
  - name: opt-in.inject.mimic.platform.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Ignore
    timeoutSeconds: 5
    # Rappelé si un webhook de mesh (Istio, Linkerd) injecte après lui (spec §9.4).
    reinvocationPolicy: IfNeeded
    # Injection par pod : seuls les pods labellisés mimic.platform.io/inject=true.
    # Le plan de contrôle n'est jamais injecté, même labellisé par erreur, ni un namespace en
    # arrêt d'urgence (spec §5.5.1).
    namespaceSelector:
      matchLabels: {mimic.platform.io/enabled: "opt-in"}
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, mimic-system]
        - key: mimic.platform.io/emergency-stop
          operator: NotIn
          values: ["true"]
    # Choisi par l'API server : un pod non concerné n'atteint jamais le webhook.
    objectSelector:
      matchLabels: {mimic.platform.io/inject: "true"}
    rules:
      - operations: ["CREATE"]
        apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
        scope: Namespaced
    clientConfig:
      service:
        name: mimic-injector
        namespace: mimic-system
        path: /mutate
        port: 443
