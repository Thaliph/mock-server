# Garde-fou du mode mock (objectif O3) : le pod ne peut plus joindre que le DNS et le
# contrôleur mimic. Toute requête non mockée échoue au lieu d'atteindre un SaaS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: checkout-mock-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: checkout
  policyTypes: ["Egress"]
  egress:
    - ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: mimic-system}
          podSelector:
            matchLabels: {app.kubernetes.io/name: mimic-controller}
      ports:
        - {protocol: TCP, port: 8443}
