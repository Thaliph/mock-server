# Garde-fou du mode mock (objectif O3) : le pod ne peut plus joindre que le DNS et le
# contrôleur mimic. En mock, le sidecar refuse déjà le TCP non HTTP et le HTTPS non
# intercepté ; la NetworkPolicy borne en plus ce qui ne passe pas par lui : l'UDP, les ports
# et CIDR exclus de l'interception (dont l'API Kubernetes) et les WebSockets relayés
# (mock.websocket: relay). Une dépendance exclue pour rester réelle pendant le tir doit être
# ajoutée ici (règle egress vers son adresse et son port).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: checkout-mock-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: checkout
  policyTypes: ["Egress"]
  egress:
    - ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: mimic-system}
          podSelector:
            matchLabels: {app.kubernetes.io/name: mimic-controller}
      ports:
        - {protocol: TCP, port: 8443}
