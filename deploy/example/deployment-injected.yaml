# Même application que deployment.yaml, avec le webhook d'injection (deploy/injector/) :
# le namespace porte le label mimic.platform.io/enabled=true et le template reste celui
# de l'application. Bascule : ressource MimicWorkload (example/mimicworkload.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: checkout
  template:
    metadata:
      labels:
        app.kubernetes.io/name: checkout
      annotations:
        # Facultatif : hôtes HTTPS à intercepter, l'app reçoit alors la CA Mimic.
        mimic.platform.io/tls-intercept: api.stripe.com
    spec:
      containers:
        - name: app
          image: registry.example.com/team/checkout:1.4.2
          ports:
            - {name: http, containerPort: 8080}
