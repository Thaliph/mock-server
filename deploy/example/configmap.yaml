apiVersion: v1
kind: ConfigMap
metadata:
  name: checkout-mimic
data:
  mimic.yaml: |
    mode: record
    inbound:
      listen: 0.0.0.0:15006
    outbound:
      listen: 127.0.0.1:15001
    admin:
      listen: 0.0.0.0:15000
    capture:
      samples_per_operation: 20
    mock:
      strategy: best
      unmatched: error
      latency_factor: 1.0
    store:
      dir: /var/lib/mimic
    # Partage, bascule et snapshots passent par le contrôleur (spec §5.5, §7.1).
    share:
      url: https://mimic-controller.mimic-system.svc:8443
      ca_file: /etc/mimic-ca/ca.crt
      token_file: /var/run/secrets/mimic/token
      interval: 10
      mode_poll: 2
