# État souhaité du workload `checkout` : seule façon de basculer ses sidecars (spec §5.5.1).
#   kubectl patch mimicworkload checkout -n shop --type merge -p '{"spec":{"mode":"mock"}}'
#   kubectl get mimicworkload -n shop   # mode, snapshot servi, pods alignés
apiVersion: mimic.platform.io/v1alpha1
kind: MimicWorkload
metadata:
  name: checkout
  namespace: shop
spec:
  mode: record
  # Pendant un tir (docs/sre-load-test.md) : seuls ces pods basculent, les autres gardent le
  # mode de leur configuration ; l'entrant n'est gardé qu'en métadonnées.
  # selector:
  #   matchLabels:
  #     pod-template-hash: 7d9f8c6b5
  # capture:
  #   inbound: metadata
  # En mock, refuser en 503 les WebSockets sortants au lieu de les relayer : plus rien ne sort.
  # mock:
  #   websocket: refuse
