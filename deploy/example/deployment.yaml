# Exemple d'application avec le sidecar mimic injecté à la main, pour voir ce qu'ajoute
# le webhook d'injection (deploy/injector/, voir deployment-injected.yaml). Kubernetes >= 1.29 pour les native sidecars.
# Le namespace porte le label mimic.platform.io/enabled=true (CA publiée par trust-manager).
# Bascule : ressource MimicWorkload (example/mimicworkload.yaml), jamais ce template.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: checkout
  template:
    metadata:
      labels:
        app.kubernetes.io/name: checkout
        # Autorise l'accès à l'API du contrôleur (NetworkPolicy).
        mimic.platform.io/sidecar: "true"
    spec:
      initContainers:
        - name: mimic-init
          image: registry.example.com/platform/mimic:0.1.0
          command: ["/usr/local/bin/mimic-init"]
          env:
            - name: MIMIC_INBOUND_PORTS
              value: "8080"
            # API Kubernetes et autres destinations qui ne doivent pas transiter par mimic.
            - name: MIMIC_EXCLUDE_OUTBOUND_CIDRS
              value: "10.96.0.1/32"
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_ADMIN", "NET_RAW"]
        # Native sidecar : démarre avant l'application et s'arrête après elle.
        - name: mimic
          image: registry.example.com/platform/mimic:0.1.0
          restartPolicy: Always
          args: ["--config", "/etc/mimic/mimic.yaml"]
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: MIMIC_WORKLOAD
              valueFrom: {fieldRef: {fieldPath: "metadata.labels['app.kubernetes.io/name']"}}
            # Label `version` des métriques, pour comparer deux versions (spec §9.3).
            - name: MIMIC_VERSION
              valueFrom: {fieldRef: {fieldPath: "metadata.labels['app.kubernetes.io/version']"}}
            - name: MIMIC_POD_TEMPLATE_HASH
              valueFrom: {fieldRef: {fieldPath: "metadata.labels['pod-template-hash']"}}
            # Sel commun aux réplicas pour des marqueurs de redaction cohérents.
            - name: MIMIC_REDACT_SALT
              valueFrom: {secretKeyRef: {name: checkout-mimic, key: redact-salt}}
          ports:
            - {name: mimic-admin, containerPort: 15100}
          readinessProbe:
            httpGet: {path: /readyz, port: mimic-admin}
          livenessProbe:
            httpGet: {path: /healthz, port: mimic-admin}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            runAsUser: 1338
            runAsGroup: 1338
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: mimic-config, mountPath: /etc/mimic}
            - {name: mimic-store, mountPath: /var/lib/mimic}
            - {name: mimic-token, mountPath: /var/run/secrets/mimic, readOnly: true}
            - {name: mimic-controller-ca, mountPath: /etc/mimic-ca, readOnly: true}
      containers:
        - name: app
          image: registry.example.com/team/checkout:1.4.2
          ports:
            - {name: http, containerPort: 8080}
      volumes:
        - name: mimic-config
          configMap: {name: checkout-mimic}
        - name: mimic-store
          emptyDir: {sizeLimit: 512Mi}
        # Jeton de ServiceAccount projeté, d'audience mimic-controller (spec §7.1).
        - name: mimic-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: mimic-controller
                  expirationSeconds: 3600
                  path: token
        - name: mimic-controller-ca
          configMap: {name: mimic-controller-ca}
