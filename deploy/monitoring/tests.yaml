# Tests unitaires des règles (spec §9.6, MON-07) : promtool test rules deploy/monitoring/tests.yaml
# Couvre les alertes dont l'expression a un piège : filtre de mode, limite nulle, cumul par
# workload, absence de série, jointure, seuil de date.
rule_files:
  - rules.yaml

evaluation_interval: 1m

tests:
  # Un pod qui diverge sonne pour son workload seul.
  - interval: 1m
    input_series:
      - series: 'mimic_controller_pods{pod="mimic-controller-0",workload="shop/checkout",state="diverging"}'
        values: '1x10'
      - series: 'mimic_controller_pods{pod="mimic-controller-0",workload="shop/web",state="diverging"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 3m
        alertname: MimicPodsDiverging
        exp_alerts: []
      - eval_time: 6m
        alertname: MimicPodsDiverging
        exp_alerts:
          - exp_labels: {severity: warning, workload: shop/checkout}
            exp_annotations:
              summary: "Des pods de shop/checkout n'appliquent pas l'état souhaité depuis 5 minutes"

  # Disque du store : seuil de 80 %, et rien quand la limite est inconnue (0).
  - interval: 1m
    input_series:
      - series: 'mimic_store_disk_bytes{namespace="shop",pod="checkout-a"}'
        values: '900x20'
      - series: 'mimic_store_disk_limit_bytes{namespace="shop",pod="checkout-a"}'
        values: '1000x20'
      - series: 'mimic_store_disk_bytes{namespace="shop",pod="checkout-b"}'
        values: '700x20'
      - series: 'mimic_store_disk_limit_bytes{namespace="shop",pod="checkout-b"}'
        values: '1000x20'
      - series: 'mimic_store_disk_bytes{namespace="shop",pod="legacy-a"}'
        values: '900x20'
      - series: 'mimic_store_disk_limit_bytes{namespace="shop",pod="legacy-a"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: MimicStoreDiskHigh
        exp_alerts:
          - exp_labels: {severity: warning, namespace: shop, pod: checkout-a}
            exp_annotations:
              summary: "Store du sidecar de shop/checkout-a rempli à plus de 80 %"
              description: "Au-delà de la taille de son emptyDir, le kubelet évince le pod."

  # Requêtes sans réponse : alerte en mock, jamais en mock-partial (relais voulu).
  - interval: 1m
    input_series:
      - series: 'mimic_mock_responses_total{namespace="shop",pod="checkout-a",authority="api.saas.io:443",match="unmatched"}'
        values: '0+10x30'
      - series: 'mimic_mock_responses_total{namespace="shop",pod="checkout-a",authority="api.saas.io:443",match="exact"}'
        values: '0+10x30'
      - series: 'mimic_mode{namespace="shop",pod="checkout-a",mode="mock"}'
        values: '1x30'
      - series: 'mimic_mock_responses_total{namespace="shop",pod="checkout-b",authority="api.saas.io:443",match="unmatched"}'
        values: '0+10x30'
      - series: 'mimic_mock_responses_total{namespace="shop",pod="checkout-b",authority="api.saas.io:443",match="exact"}'
        values: '0+10x30'
      - series: 'mimic_mode{namespace="shop",pod="checkout-b",mode="mock"}'
        values: '0x30'
      - series: 'mimic_mode{namespace="shop",pod="checkout-b",mode="mock-partial"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: MimicMockUnmatched
        exp_alerts:
          - exp_labels: {severity: warning, namespace: shop, pod: checkout-a}
            exp_annotations:
              summary: "Plus de 5 % des appels sortants sans réponse enregistrée en mock (shop/checkout-a)"
              description: "Ces appels reçoivent un 599 : le snapshot ne couvre pas le trafic. Détail dans mimicctl report."

  # Certificats : moins de 7 jours sonne, 30 jours non, 0 (sans TLS) non plus.
  - interval: 1m
    input_series:
      # 600 s (instant d'évaluation) + 6 jours.
      - series: 'mimic_controller_certificate_expiry_timestamp_seconds{pod="mimic-controller-0"}'
        values: '519000x20'
      # 600 s + 30 jours.
      - series: 'mimic_controller_certificate_expiry_timestamp_seconds{pod="mimic-controller-1"}'
        values: '2592600x20'
      - series: 'mimic_injector_certificate_expiry_timestamp_seconds{pod="mimic-injector-0"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: MimicControllerCertificateExpiring
        exp_alerts:
          - exp_labels: {severity: warning, pod: mimic-controller-0}
            exp_annotations:
              summary: "Le certificat servi par le contrôleur (mimic-controller-0) expire dans moins de 7 jours"
              description: "Renouvellement cert-manager en échec, ou nouveau certificat refusé par le rechargement à chaud."
      - eval_time: 10m
        alertname: MimicInjectorCertificateExpiring
        exp_alerts: []

  # Aucune réplique active, puis plus aucune série du tout.
  - interval: 1m
    input_series:
      - series: 'mimic_controller_leader{pod="mimic-controller-0"}'
        values: '0x5 _x10'
      - series: 'up{job="autre"}'
        values: '1x15'
    alert_rule_test:
      - eval_time: 3m
        alertname: MimicControllerNoLeader
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations:
              summary: "Aucune réplique active du contrôleur mimic"
      - eval_time: 14m
        alertname: MimicControllerNoLeader
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations:
              summary: "Aucune réplique active du contrôleur mimic"

  # Éviction : seuls les pods injectés comptent.
  - interval: 1m
    input_series:
      - series: 'kube_pod_status_reason{namespace="shop",pod="checkout-a",reason="Evicted"}'
        values: '1x5'
      - series: 'kube_pod_init_container_info{namespace="shop",pod="checkout-a",container="mimic"}'
        values: '1x5'
      - series: 'kube_pod_status_reason{namespace="shop",pod="batch-a",reason="Evicted"}'
        values: '1x5'
    alert_rule_test:
      - eval_time: 2m
        alertname: MimicPodEvicted
        exp_alerts:
          - exp_labels: {severity: warning, namespace: shop, pod: checkout-a}
            exp_annotations:
              summary: "Pod injecté shop/checkout-a évincé"
              description: "Le message de l'éviction dit quel volume ou quelle ressource a débordé (kubectl describe pod)."

  # Deux versions de mimic pendant plus de 24 h ; le label version (application) ne compte pas.
  - interval: 10m
    input_series:
      - series: 'mimic_build_info{namespace="shop",pod="checkout-a",mimic_version="0.1.0",revision="a",version="1.4.2"}'
        values: '1x160'
      - series: 'mimic_build_info{namespace="shop",pod="checkout-b",mimic_version="0.1.0",revision="a",version="1.4.3"}'
        values: '1x160'
      - series: 'mimic_build_info{namespace="mimic-system",pod="mimic-controller-0",mimic_version="0.2.0",revision="b"}'
        values: '1x160'
    alert_rule_test:
      - eval_time: 12h
        alertname: MimicVersionSkew
        exp_alerts: []
      - eval_time: 25h
        alertname: MimicVersionSkew
        exp_alerts:
          - exp_labels: {severity: info}
            exp_annotations:
              summary: "Plusieurs versions de mimic tournent depuis 24 h"
              description: "Un sidecar ne change de version qu'au redémarrage de son pod."
