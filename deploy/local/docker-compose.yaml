# Mock local (spec §9.7) : l'application appelle une dépendance qui n'existe pas ici
# (quotes.internal), le sidecar répond depuis le snapshot.
#   docker compose up
# Avec un snapshot du cluster : mimicctl pull <workload> -n <ns> -o snapshot.jsonl
services:
  mimic:
    image: ghcr.io/thaliph/mimic:0.1.0
    command: ["--config", "/local/mimic.yaml", "--mock-from", "/local/snapshot.jsonl"]
    volumes:
      - ./:/local:ro
    ports:
      - "15100:15100"
  app:
    image: curlimages/curl:8.11.1
    depends_on: [mimic]
    environment:
      # curl ne lit que la forme en minuscules pour HTTP ; d'autres clients la majuscule.
      HTTP_PROXY: http://mimic:15101
      http_proxy: http://mimic:15101
      DEPENDENCY_URL: http://quotes.internal:8080/quote?zip=75001
    command: ["sh", "-c", "while true; do curl -s -i \"$$DEPENDENCY_URL\"; echo; sleep 5; done"]
