# Tir de charge depuis le cluster (spec §5.9) : `mimicctl load` dans un Job, avec l'image de
# Mimic. Le workload `checkout` du namespace `perf` doit être en mock, pods alignés :
#   mimicctl mode checkout mock -n perf --capture-inbound metadata
# Rapport : `kubectl logs -n perf job/checkout-load`.
#
# Droits du Job :
# - lire la fiche du workload et ses requêtes sur l'interface du contrôleur, par port-forward
#   (pods et pods/portforward dans mimic-system) ;
# - relever CPU et mémoire des pods du workload (metrics.k8s.io, metrics-server requis).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mimic-load
  namespace: perf
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mimic-load-metrics
  namespace: perf
rules:
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mimic-load-metrics
  namespace: perf
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mimic-load-metrics
subjects:
  - kind: ServiceAccount
    name: mimic-load
    namespace: perf
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mimic-load-controller-ui
  namespace: mimic-system
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mimic-load-controller-ui-perf
  namespace: mimic-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mimic-load-controller-ui
subjects:
  - kind: ServiceAccount
    name: mimic-load
    namespace: perf
---
apiVersion: batch/v1
kind: Job
metadata:
  name: checkout-load
  namespace: perf
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      # Le Job ne doit pas recevoir de sidecar Mimic : il est le client du tir.
      annotations:
        mimic.platform.io/inject: "false"
    spec:
      serviceAccountName: mimic-load
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1338
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: load
          image: ghcr.io/thaliph/mimic:0.1.0
          command: ["mimicctl"]
          args:
            - load
            - checkout
            - --namespace=perf
            - --target=http://checkout.perf:8080
            - --ramp
            - --start=1
            - --max=256
            - --step-duration=60s
            - --max-p99=500ms
          resources:
            requests: {cpu: "1", memory: 256Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
