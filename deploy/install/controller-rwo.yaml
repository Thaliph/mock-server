---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: mimicworkloads.mimic.platform.io
spec:
  group: mimic.platform.io
  names:
    kind: MimicWorkload
    plural: mimicworkloads
    shortNames:
    - mw
    singular: mimicworkload
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.mode
      name: Mode
      type: string
    - jsonPath: .status.snapshot
      name: Snapshot
      type: string
    - jsonPath: .status.aligned
      name: Aligned
      type: integer
    - jsonPath: .status.pods
      name: Pods
      type: integer
    - jsonPath: .status.unmatched
      name: Unmatched
      type: integer
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for MimicWorkloadSpec via `CustomResource`
        properties:
          spec:
            properties:
              capture:
                description: Capture imposée aux sidecars ; absente, chacun garde
                  celle de sa configuration.
                nullable: true
                properties:
                  inbound:
                    description: |-
                      Capture de l'entrant : `full`, `metadata` (sans query, headers ni body, rien de
                      publié) ou `off` (métriques seules).
                    enum:
                    - full
                    - metadata
                    - "off"
                    type: string
                type: object
              mock:
                description: Réglages du mock imposés aux sidecars ; absents, chacun
                  garde ceux de sa configuration.
                nullable: true
                properties:
                  websocket:
                    description: |-
                      Poignée de main WebSocket sortante en mock : `relay` (relayée vers la dépendance) ou
                      `refuse` (réponse `503` sans joindre la dépendance).
                    enum:
                    - relay
                    - refuse
                    type: string
                type: object
              mode:
                description: Mode souhaité pour tous les pods du workload.
                enum:
                - passthrough
                - record
                - mock
                - mock-partial
                type: string
              selector:
                description: |-
                  Seuls les pods sélectionnés appliquent l'état souhaité ; les autres gardent le mode
                  de leur configuration (spec §5.5.1). Absent : tous les pods du workload.
                nullable: true
                properties:
                  matchExpressions:
                    items:
                      properties:
                        key:
                          type: string
                        operator:
                          description: '`In`, `NotIn`, `Exists` ou `DoesNotExist`.'
                          type: string
                        values:
                          items:
                            type: string
                          type: array
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                  matchLabels:
                    additionalProperties:
                      type: string
                    type: object
                type: object
              snapshot:
                description: Snapshot à rejouer ; absent, le contrôleur en construit
                  un à l'entrée en mock.
                nullable: true
                type: string
            required:
            - mode
            type: object
          status:
            nullable: true
            properties:
              aligned:
                format: uint32
                minimum: 0
                type: integer
              conditions:
                default: []
                items:
                  properties:
                    message:
                      nullable: true
                      type: string
                    reason:
                      nullable: true
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  required:
                  - status
                  - type
                  type: object
                type: array
              observedGeneration:
                format: int64
                nullable: true
                type: integer
              pods:
                format: uint32
                minimum: 0
                type: integer
              snapshot:
                nullable: true
                type: string
              snapshotExchanges:
                description: |-
                  Échanges du snapshot servi (CTL-45, cycle de vie des snapshots) ; absent sans
                  snapshot ou si son nombre d'échanges n'a pas pu être lu.
                format: uint64
                minimum: 0
                nullable: true
                type: integer
              unmatched:
                default: 0
                description: Requêtes sans réponse du mock (599, 413) relevées par
                  les pods sélectionnés.
                format: uint64
                minimum: 0
                type: integer
            required:
            - aligned
            - pods
            type: object
        required:
        - spec
        title: MimicWorkload
        type: object
    served: true
    storage: true
    subresources:
      status: {}
---
