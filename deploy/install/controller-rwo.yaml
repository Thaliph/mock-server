apiVersion: v1
data:
  controller.yaml: |
    listen: 0.0.0.0:8443
    ui_listen: 127.0.0.1:8081
    # API agrégée de lecture data.mimic.platform.io (spec §9.2c) : CA du front proxy lue
    # dans kube-system/extension-apiserver-authentication.
    aggregated:
      listen: 0.0.0.0:8444
    tls:
      cert_file: /etc/mimic/tls/tls.crt
      key_file: /etc/mimic/tls/tls.key
    auth:
      kind: kubernetes
    store: file:///var/lib/mimic-controller
    retention: 86400                   # 24 heures ; les exemples par endpoint couvrent le reste
    max_exchanges_per_workload: 200000
    max_exchanges_total: 1000000
    samples_per_operation: 20
    max_bytes_per_workload: 268435456
    max_exemplars_per_workload: 10000
    max_exemplar_bytes_per_workload: 67108864  # 64 MiB d'exemples sérialisés par workload
    max_exemplar_bytes_total: 536870912        # 512 MiB tous workloads confondus
    discovery_interval: 30
    snapshot:
      max_per_key: 50
    pod_timeout: 30
    pod_forget: 600
    # Deux réplicas, une seule active (spec §5.5.4) ; identité : POD_NAME.
    leader_election:
      lease: mimic-controller
      namespace: mimic-system
      lease_duration: 15
      renew_deadline: 10
      retry_period: 2
kind: ConfigMap
metadata:
  name: mimic-controller
  namespace: mimic-system
---
apiVersion: v1
kind: Service
metadata:
  name: mimic-controller
  namespace: mimic-system
spec:
  ports:
  - name: api
    port: 8443
    targetPort: api
  - name: aggregated
    port: 8444
    targetPort: aggregated
  selector:
    app.kubernetes.io/name: mimic-controller
    mimic.platform.io/leader: "true"
---
apiVersion: scheduling.k8s.io/v1
description: 'Plan de contrôle de mimic : webhook d''injection et contrôleur.'
globalDefault: false
kind: PriorityClass
metadata:
  name: mimic-control-plane
value: 1000000
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mimic-controller
  namespace: mimic-system
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mimic-controller
  namespace: mimic-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: mimic-controller
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mimic-controller
    spec:
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: mimic-controller
            topologyKey: kubernetes.io/hostname
      containers:
      - args:
        - --config
        - /etc/mimic/controller.yaml
        command:
        - /usr/local/bin/mimic-controller
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        image: ghcr.io/thaliph/mimic:0.1.0
        livenessProbe:
          httpGet:
            path: /healthz
            port: api
            scheme: HTTPS
        name: controller
        ports:
        - containerPort: 8443
          name: api
        - containerPort: 8444
          name: aggregated
        readinessProbe:
          httpGet:
            path: /healthz
            port: api
            scheme: HTTPS
        resources:
          limits:
            memory: 4Gi
          requests:
            cpu: 100m
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /etc/mimic/controller.yaml
          name: config
          subPath: controller.yaml
        - mountPath: /etc/mimic/tls
          name: tls
          readOnly: true
        - mountPath: /var/lib/mimic-controller
          name: data
      priorityClassName: mimic-control-plane
      securityContext:
        fsGroup: 1338
        runAsGroup: 1338
        runAsNonRoot: true
        runAsUser: 1338
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: mimic-controller
      terminationGracePeriodSeconds: 30
      volumes:
      - configMap:
          name: mimic-controller
        name: config
      - name: tls
        secret:
          secretName: mimic-controller-tls
      - name: data
        persistentVolumeClaim:
          claimName: mimic-controller
---
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  annotations:
    cert-manager.io/inject-ca-from: mimic-system/mimic-controller-tls
  name: v1alpha1.data.mimic.platform.io
spec:
  group: data.mimic.platform.io
  groupPriorityMinimum: 1000
  service:
    name: mimic-controller
    namespace: mimic-system
    port: 8444
  version: v1alpha1
  versionPriority: 15
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mimic-controller-ca
  namespace: mimic-system
spec:
  commonName: mimic-controller-ca
  duration: 87600h
  isCA: true
  issuerRef:
    kind: Issuer
    name: mimic-selfsigned
  privateKey:
    algorithm: ECDSA
    size: 256
  secretName: mimic-controller-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mimic-controller-tls
  namespace: mimic-system
spec:
  dnsNames:
  - mimic-controller.mimic-system.svc
  - mimic-controller.mimic-system.svc.cluster.local
  duration: 2160h
  issuerRef:
    kind: Issuer
    name: mimic-ca
  privateKey:
    algorithm: ECDSA
    size: 256
  renewBefore: 360h
  secretName: mimic-controller-tls
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: mimic-ca
  namespace: mimic-system
spec:
  ca:
    secretName: mimic-controller-ca
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: mimic-selfsigned
  namespace: mimic-system
spec:
  selfSigned: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mimic-controller
  namespace: mimic-system
spec:
  ingress:
  - from:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          mimic.platform.io/sidecar: "true"
    ports:
    - port: 8443
      protocol: TCP
  - from:
    - ipBlock:
        cidr: 0.0.0.0/0
    - ipBlock:
        cidr: ::/0
    ports:
    - port: 8444
      protocol: TCP
  - from:
    - namespaceSelector:
        matchLabels:
          mimic.platform.io/monitoring: "true"
    ports:
    - port: 8443
      protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mimic-controller
  policyTypes:
  - Ingress
---
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: mimic-controller-ca
spec:
  sources:
  - secret:
      key: ca.crt
      name: mimic-controller-ca
  target:
    configMap:
      key: ca.crt
    namespaceSelector:
      matchExpressions:
      - key: mimic.platform.io/enabled
        operator: In
        values:
        - "true"
        - opt-in
