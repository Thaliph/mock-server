# CA dédiée au contrôleur et certificat serveur, gérés par cert-manager (spec §7.1).
# Les sidecars ne font confiance qu'à cette CA.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: mimic-selfsigned
  namespace: mimic-system
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mimic-controller-ca
  namespace: mimic-system
spec:
  isCA: true
  commonName: mimic-controller-ca
  secretName: mimic-controller-ca
  duration: 87600h
  privateKey: {algorithm: ECDSA, size: 256}
  issuerRef: {name: mimic-selfsigned, kind: Issuer}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: mimic-ca
  namespace: mimic-system
spec:
  ca:
    secretName: mimic-controller-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mimic-controller-tls
  namespace: mimic-system
spec:
  secretName: mimic-controller-tls
  duration: 2160h
  renewBefore: 360h
  dnsNames:
    - mimic-controller.mimic-system.svc
    - mimic-controller.mimic-system.svc.cluster.local
  privateKey: {algorithm: ECDSA, size: 256}
  issuerRef: {name: mimic-ca, kind: Issuer}
---
# Publication de la partie publique de la CA dans chaque namespace (trust-manager),
# sous la forme d'une ConfigMap `mimic-controller-ca` montée par les sidecars.
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: mimic-controller-ca
spec:
  sources:
    - secret: {name: mimic-controller-ca, key: ca.crt}
  target:
    configMap: {key: ca.crt}
    # Namespaces injectés, en entier (true) ou pod par pod (opt-in).
    namespaceSelector:
      matchExpressions:
        - key: mimic.platform.io/enabled
          operator: In
          values: ["true", "opt-in"]
