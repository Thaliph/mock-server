# Droits du contrôleur (spec §7.1) : rien au-delà de ce qui suit.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mimic-controller
  namespace: mimic-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mimic-controller
rules:
  - apiGroups: ["mimic.platform.io"]
    resources: ["mimicworkloads"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["mimic.platform.io"]
    resources: ["mimicworkloads/status"]
    verbs: ["patch"]
  # Validation des jetons des sidecars.
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  # Rattachement du pod authentifié à son workload, et ses labels (spec.selector).
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
  # Garde-fou production : labels des namespaces (env=production, spec §5.5.1).
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  # API agrégée : autorisation de chaque lecture (spec §9.2c).
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
---
# API agrégée : CA du front proxy de l'API server (ConfigMap
# kube-system/extension-apiserver-authentication), par le Role standard.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mimic-controller-auth-reader
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: extension-apiserver-authentication-reader
subjects:
  - kind: ServiceAccount
    name: mimic-controller
    namespace: mimic-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mimic-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mimic-controller
subjects:
  - kind: ServiceAccount
    name: mimic-controller
    namespace: mimic-system
---
# Élection de la réplique active (spec §5.5.4), dans mimic-system seulement : le bail, et la
# marque posée sur les pods du contrôleur.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mimic-controller
  namespace: mimic-system
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["mimic-controller"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mimic-controller
  namespace: mimic-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mimic-controller
subjects:
  - kind: ServiceAccount
    name: mimic-controller
    namespace: mimic-system
---
# Qui peut basculer un workload : à lier par namespace (RoleBinding) aux équipes autorisées.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mimic-operator
rules:
  - apiGroups: ["mimic.platform.io"]
    resources: ["mimicworkloads"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # `mimicctl mode` lit les labels du namespace (garde-fou production) ; lié par
  # RoleBinding, ce droit ne porte que sur le namespace du RoleBinding.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get"]
---
# Lecture des données enregistrées d'un namespace (export, requêtes, rapport, snapshots) par
# l'API agrégée (spec §9.2c) : à lier par RoleBinding dans le namespace d'une équipe, par
# exemple `kubectl -n shop create rolebinding mimic-data --clusterrole=mimic-data-viewer
# --group=shop-devs`. Ne donne rien sur les autres namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mimic-data-viewer
rules:
  - apiGroups: ["data.mimic.platform.io"]
    resources:
      - workloads
      - workloads/operations
      - workloads/openapi
      - workloads/requests
      - workloads/snapshots
    verbs: ["get", "list"]
---
# Port-forward vers la réplique active du contrôleur (spec §9.5) : écritures du cycle de vie
# des snapshots (`mimicctl snapshot pin|import|gc`), et lectures sur un cluster sans l'API
# agrégée. Ouvre l'interface sur TOUS les namespaces : réservé aux exploitants, par exemple
# `kubectl -n mimic-system create rolebinding mimic-cli --role=mimic-cli --group=sre`.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mimic-cli
  namespace: mimic-system
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["create"]
---
# Lecture seule, agrégée au rôle standard `view`.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mimic-viewer
  labels:
    rbac.authorization.k8s.io/aggregate-to-view: "true"
rules:
  - apiGroups: ["mimic.platform.io"]
    resources: ["mimicworkloads"]
    verbs: ["get", "list", "watch"]
