# Garde-fou production à l'admission (spec §5.5.1, E2E-04), facultatif : Kubernetes >= 1.30.
# Refuse une MimicWorkload en mock ou mock-partial dans un namespace labellisé
# env=production. Le contrôleur applique le même garde-fou dans tous les cas, y compris
# quand le label est posé après la création de la ressource.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: mimic-production-guard
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["mimic.platform.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["mimicworkloads"]
  validations:
    - expression: >-
        !(object.spec.mode in ['mock', 'mock-partial'])
        || !has(namespaceObject.metadata.labels)
        || !('env' in namespaceObject.metadata.labels)
        || namespaceObject.metadata.labels['env'] != 'production'
      message: "mimic : mock et mock-partial sont refusés dans un namespace labellisé env=production"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: mimic-production-guard
spec:
  policyName: mimic-production-guard
  validationActions: ["Deny"]
