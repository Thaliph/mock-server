apiVersion: v1
kind: ConfigMap
metadata:
  name: mimic-controller
  namespace: mimic-system
data:
  controller.yaml: |
    listen: 0.0.0.0:8443
    ui_listen: 127.0.0.1:8081
    tls:
      cert_file: /etc/mimic/tls/tls.crt
      key_file: /etc/mimic/tls/tls.key
    auth:
      kind: kubernetes
    store: file:///var/lib/mimic-controller
    retention: 86400                   # 24 heures ; les exemples par endpoint couvrent le reste
    max_exchanges_per_workload: 200000
    max_exchanges_total: 1000000
    samples_per_operation: 20
    max_bytes_per_workload: 268435456
    max_exemplars_per_workload: 10000
    max_exemplar_bytes_per_workload: 67108864  # 64 MiB d'exemples sérialisés par workload
    max_exemplar_bytes_total: 536870912        # 512 MiB tous workloads confondus
    discovery_interval: 30
    snapshot:
      max_per_key: 50
    pod_timeout: 30
    pod_forget: 600
    # Deux réplicas, une seule active (spec §5.5.4) ; identité : POD_NAME.
    leader_election:
      lease: mimic-controller
      namespace: mimic-system
      lease_duration: 15
      renew_deadline: 10
      retry_period: 2
---
# Monté par les deux réplicas, écrit par la seule active (spec §5.5.4). ReadWriteOnce
# suffit sur un nœud (kind) ou avec un volume local, qui garde les deux réplicas sur le même
# nœud. Sur plusieurs nœuds : ReadWriteMany (storageClassName d'un stockage partagé : EFS,
# Filestore, Azure Files, CephFS, NFS…), ou `store: s3://…` et plus de PVC du tout.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mimic-controller
  namespace: mimic-system
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests: {storage: 10Gi}
---
# Deux réplicas, une seule active, élue par le bail mimic-system/mimic-controller : elle porte
# le label mimic.platform.io/leader=true, que le Service sélectionne (spec §5.5.4). Les deux
# sont Ready ; la passive répond 503 et ne touche pas au support.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mimic-controller
  namespace: mimic-system
spec:
  replicas: 2
  # Une nouvelle réplique est prête (passive) avant qu'une ancienne parte ; la marque
  # porte un pod-deletion-cost : l'active part en dernier, d'où une seule bascule.
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app.kubernetes.io/name: mimic-controller}
  template:
    metadata:
      labels: {app.kubernetes.io/name: mimic-controller}
    spec:
      serviceAccountName: mimic-controller
      # Deux nœuds quand c'est possible, un seul sinon (kind, PVC ReadWriteOnce local).
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: {app.kubernetes.io/name: mimic-controller}
      # Arrêt propre : marque retirée, exemples écrits, bail rendu.
      terminationGracePeriodSeconds: 30
      priorityClassName: mimic-control-plane
      # UID 1338 comme le sidecar ; jamais 1337, l'UID d'istio-proxy.
      securityContext:
        runAsUser: 1338
        runAsGroup: 1338
        fsGroup: 1338
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: controller
          image: ghcr.io/thaliph/mimic:0.1.0
          command: ["/usr/local/bin/mimic-controller"]
          args: ["--config", "/etc/mimic/controller.yaml"]
          env:
            # Identité dans l'élection, et pod qui porte la marque.
            - name: POD_NAME
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
          ports:
            - {name: api, containerPort: 8443}
          readinessProbe:
            httpGet: {path: /healthz, port: api, scheme: HTTPS}
          livenessProbe:
            httpGet: {path: /healthz, port: api, scheme: HTTPS}
          # Environ 2 Ko par échange gardé : max_exchanges_total (1 000 000), plus le pic
          # d'une inférence sur le plus gros workload. La demande suit l'usage d'un
          # contrôleur chargé (quelques centaines de milliers d'échanges, exemples compris),
          # pour ne pas être le premier évincé sous pression mémoire.
          resources:
            requests: {cpu: 100m, memory: 1Gi}
            limits: {memory: 4Gi}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: config, mountPath: /etc/mimic/controller.yaml, subPath: controller.yaml}
            - {name: tls, mountPath: /etc/mimic/tls, readOnly: true}
            - {name: data, mountPath: /var/lib/mimic-controller}
      volumes:
        - name: config
          configMap: {name: mimic-controller}
        - name: tls
          secret: {secretName: mimic-controller-tls}
        - name: data
          persistentVolumeClaim: {claimName: mimic-controller}
---
# Seule l'API des sidecars est exposée, et seulement par la réplique active ; l'interface
# reste sur 127.0.0.1:8081 :
#   kubectl port-forward -n mimic-system "$(kubectl -n mimic-system get pod -l mimic.platform.io/leader=true -o name)" 8081
apiVersion: v1
kind: Service
metadata:
  name: mimic-controller
  namespace: mimic-system
spec:
  selector:
    app.kubernetes.io/name: mimic-controller
    mimic.platform.io/leader: "true"
  ports:
    - {name: api, port: 8443, targetPort: api}
---
# Un drain n'évince jamais les deux réplicas à la fois ; la passive prend le relais.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mimic-controller
  namespace: mimic-system
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: mimic-controller}
---
# Seuls les pods porteurs d'un sidecar mimic joignent l'API ; la collecte des métriques
# (/metrics sur le même port, sans jeton) vient des namespaces labellisés
# mimic.platform.io/monitoring=true : `kubectl label namespace monitoring
# mimic.platform.io/monitoring=true` pour celui de Prometheus ou VictoriaMetrics.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mimic-controller
  namespace: mimic-system
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: mimic-controller}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels: {mimic.platform.io/sidecar: "true"}
      ports:
        - {port: 8443, protocol: TCP}
    - from:
        - namespaceSelector:
            matchLabels: {mimic.platform.io/monitoring: "true"}
      ports:
        - {port: 8443, protocol: TCP}
