# Crate versions that scripts/check-cooldown.py accepts inside the 14-day cooldown (#269). Each entry
# names the crate and the exact version and gives the reason it is needed now, for example a fix of
# a published advisory that cannot wait. Keep the list short: an entry is a decision, reviewed in the
# pull request that adds it.
#
# [[allow]]
# name = "example-crate"
# version = "1.2.3"
# reason = "RUSTSEC-0000-0000 fix; the advisory is worse than the unknown of a fresh release"


[[allow]]
name = "url"
version = "2.5.9"
reason = "RUSTSEC-2026-0592 fix (stack overflow in Url::origin on nested blob: URLs); cargo deny fails main without it. mimic does not call Url::origin, but the advisory gate is a required check"

[[allow]]
name = "form_urlencoded"
version = "1.2.3"
reason = "required by url 2.5.9 (^1.2.3), the RUSTSEC-2026-0592 fix above; same maintainers and release"
