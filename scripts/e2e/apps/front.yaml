# Service A of the e2e apps (scripts/e2e/apps/service.py) and the client that calls it. A forwards
# /front/<path> to UPSTREAM, the Service of B (`users` in the namespace disc-22, see users.yaml). Apply
# with `kubectl -n <namespace> apply -f` to a namespace that mimic does not inject: its traffic is the
# client's, not a mimic-observed one. Pinned: python:3.13-slim by digest.
apiVersion: apps/v1
kind: Deployment
metadata: {name: front}
spec:
  replicas: 1
  selector: {matchLabels: {app: front}}
  template:
    metadata: {labels: {app: front}}
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: app
          image: docker.io/library/python:3.13-slim@sha256:2d44738ebf4ce5f63b9d9ea871e9c7cfdc0426f7b0c97cac915fd88ded1d86bb
          command: [python3, /code/service.py]
          env:
            - {name: APP_NAME, value: front}
            - {name: UPSTREAM, value: "http://users.disc-22.svc:8080"}
          ports: [{name: api, containerPort: 8080}]
          readinessProbe: {tcpSocket: {port: api}, periodSeconds: 1}  # front is not injected
          volumeMounts: [{name: code, mountPath: /code, readOnly: true}]
      volumes:
        - {name: code, configMap: {name: apps-code}}
---
apiVersion: v1
kind: Service
metadata: {name: front}
spec:
  selector: {app: front}
  ports: [{name: api, port: 8080, targetPort: api}]
---
apiVersion: v1
kind: Pod
metadata: {name: client, labels: {app: client}}
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: client
      image: docker.io/library/python:3.13-slim@sha256:2d44738ebf4ce5f63b9d9ea871e9c7cfdc0426f7b0c97cac915fd88ded1d86bb
      command: [sleep, "3600"]
