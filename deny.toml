# Dependency policy, checked by `cargo deny check` in CI: known vulnerabilities and
# unmaintained crates (RustSec), licences compatible with Apache-2.0, allowed sources.
[graph]
all-features = true

[advisories]
# Any advisory fails the check; an exception is declared here with its reason.
ignore = []

[licenses]
confidence-threshold = 0.9
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "BSL-1.0",
  "CC0-1.0",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
